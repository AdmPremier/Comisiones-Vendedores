<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;color:#1a1a1a;background:#f5f5f5;min-height:100vh}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#1a1a1a;outline:none}

// ============================================================
// SUPABASE HELPERS
// ============================================================
async function sbFetch(path,opts={}){
  const res=await fetch(SUPABASE_URL+'/rest/v1/'+path,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation',...opts.headers},...opts});
  if(!res.ok){const e=await res.text();throw new Error(e);}
  const txt=await res.text();return txt?JSON.parse(txt):[];
}

// ============================================================
// UTILS
// ============================================================
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(n){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(n||0);}
function fmtOpt(n){return n==null?'—':fmt(n);}
function pad2(n){return String(n).padStart(2,'0');}
function normKey(s){return (s==null?'':String(s)).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
function parseNum(v){
  if(v==null||v==='')return 0;
  if(typeof v==='number')return v;
  let s=String(v).trim().replace(/\$/g,'').replace(/\s/g,'');
  if(s==='')return 0;
  const lastComma=s.lastIndexOf(','),lastDot=s.lastIndexOf('.');
  if(lastComma>-1&&lastDot>-1){
    if(lastComma>lastDot)s=s.replace(/\./g,'').replace(',','.');
    else s=s.replace(/,/g,'');
  }else if(lastComma>-1){
    s=s.replace(/\./g,'').replace(',','.');
  }
  const n=parseFloat(s);
  return isNaN(n)?0:n;
}
function parseFechaCell(v){
  if(v==null||v==='')return null;
  if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+pad2(v.getMonth()+1)+'-'+pad2(v.getDate());
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){let y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+pad2(m[2])+'-'+pad2(m[1]);}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+'-'+pad2(m[2])+'-'+pad2(m[3]);
  return null;
}
function fmtFecha(iso){if(!iso)return '—';const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y;}
function closeModal(){document.getElementById('modal').innerHTML='';}

// ============================================================
// ESTADO GLOBAL
// ============================================================
let CU=null;
let DB={vendedores:[],liquidaciones:[]};

async function loadVendedores(){
  DB.vendedores=await sbFetch('vendedores?select=*&order=orden.asc');
}
function findVendedor(nombre){
  const nk=normKey(nombre);
  return DB.vendedores.find(v=>normKey(v.nombre_mostrar)===nk||normKey(v.etiqueta_odoo)===nk);
}

// ============================================================
// LOGIN
// ============================================================

    loadVendedores().then(()=>sTab('cargar')).catch(e=>{document.getElementById('mc').innerHTML='<div class="loading" style="color:#c00">Error: '+esc(e.message)+'</div>';});

document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
function doLogout(){CU=null;document.getElementById('app-screen').classList.add('hidden');document.getElementById('login-screen').classList.remove('hidden');document.getElementById('lp').value='';}

function bNav(){
  const tabs=[{id:'cargar',label:'Cargar Liquidación'},{id:'historial',label:'Historial'},{id:'reporte',label:'Reporte por Cliente'},{id:'excluidos',label:'Excluidos'},{id:'vendedores',label:'Vendedores'},{id:'implementaciones',label:'Implementaciones'}];

  rImplBadge();

function sTab(tab){

  const el=document.getElementById('tab-'+tab);if(el)el.classList.add('active');
  if(tab==='cargar')rCargarTab();

  else if(tab==='vendedores')rVendedoresTab();
  else if(tab==='implementaciones')rImplTab();
}

// ============================================================
// PARSEO DEL EXCEL
// ============================================================
const SHEET_KEYWORDS={
  resumen:['resumen'],
  detalle:['detalle'],
  sinComision:['revisar','sin comision'],
  excluidos:['exclu']
};
function findSheetName(wb,keywords){
  const names=wb.SheetNames;
  for(const kw of keywords){
    const hit=names.find(n=>normKey(n).includes(normKey(kw)));
    if(hit)return hit;
  }
  return null;
}
// Columnas por posición (0-based). Formato viejo (4 hojas: Detalle - Comisión Calculada /
// Sin Comisión - Revisar / Excluidos) — se mantiene por si alguna vez vuelve a aparecer.
const COLS_DETALLE_V1=['vendedor','empresa','fecha','cliente','nro_pago','tipo_doc','nro_documento','importe_pago','neto_documento','total_documento','base_comisionable','pct_comision','comision_a_pagar'];
const COLS_SIN_COMISION=['vendedor','empresa','fecha','cliente','nro_pago','motivo','importe','aplica'];
const COLS_EXCLUIDOS=['cliente','motivo','empresa','fecha','nro_pago','importe'];
// Formato nuevo (7-sep-2026 en adelante): una sola hoja "Detalle" ya pulida a mano por Diego,
// sin hojas separadas de Sin Comisión/Excluidos. "Comision" en blanco = todavía sin definir
// (va a la sección "a revisar"); "Comision" = 0 es un valor real (ej. cheque rechazado, "CHR").
const COLS_DETALLE_V2=['vendedor','empresa','fecha','cliente','nro_pago','importe','documento','tasa','donde_se_liquida','tipo_ab','comision'];

function sheetRows(ws){
  // header:1 -> array de arrays; nos independiza de cómo estén tipeados los encabezados reales.
  return XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
}
function findHeaderRowIdx(rawRows,firstColKeyword){
  // Busca la fila cuya primera celda matchea el encabezado esperado (ej: "Vendedor", "Cliente").
  // Necesario porque algunas hojas traen una fila de título arriba del encabezado real y otras no.
  const nk=normKey(firstColKeyword);
  for(let i=0;i<rawRows.length;i++){
    if(normKey(rawRows[i]&&rawRows[i][0])===nk)return i;
  }
  return -1; // no se encontró: el caller cae a asumir que la fila 0 es el encabezado
}
function mapRows(rawRows,cols,headerKeyword){
  const headerIdx=findHeaderRowIdx(rawRows,headerKeyword);
  const startIdx=headerIdx>=0?headerIdx+1:1;
  const out=[];
  for(let i=startIdx;i<rawRows.length;i++){
    const row=rawRows[i];
    if(!row||row.every(c=>c===''||c==null))continue;
    const obj={};
    cols.forEach((key,idx)=>{obj[key]=row[idx]!==undefined?row[idx]:'';});
    out.push(obj);
  }
  return out;
}
// Alias (ya normalizados con normKey) de los encabezados de la hoja "Sin Comisión - Revisar".
// Esta hoja cambió de diseño entre la salida cruda de la tarea (7-8 columnas) y la versión pulida
// a mano (13 columnas, con Tipo Doc./N° Documento/% Comisión/A-B/Base/Comisión), así que se lee
// por nombre de columna en vez de por posición.
const ALIAS_SIN_COMISION={
  vendedor:['vendedor'],empresa:['empresa'],fecha:['fecha'],cliente:['cliente'],
  nro_pago:['n de pago'],categoria:['tipo doc'],nro_documento:['n documento'],
  importe:['importe'],pct:['comision'],motivo:['motivo'],tipo_ab:['a b','aplica'],
  base:['base comisionable'],comision:['comision a pagar']
};
// Alias de la hoja "Detalle - Comisión Calculada" (formato de 4 hojas).
const ALIAS_DETALLE_V1={
  vendedor:['vendedor'],empresa:['empresa'],fecha:['fecha'],cliente:['cliente'],nro_pago:['n de pago'],
  tipo_doc:['tipo doc'],nro_documento:['n documento'],importe_pago:['importe del pago','importe'],
  neto_documento:['neto documento'],total_documento:['total documento'],
  base_comisionable:['base comisionable'],pct_comision:['comision'],comision_a_pagar:['comision a pagar']
};
function mapRowsByHeader(rawRows,headerKeyword,aliases,fallbackCols,requeridos=['vendedor','importe']){
  const headerIdx=findHeaderRowIdx(rawRows,headerKeyword);
  if(headerIdx<0)return mapRows(rawRows,fallbackCols,headerKeyword);
  const headers=(rawRows[headerIdx]||[]).map(h=>normKey(h));
  const colIdx={};
  for(const [campo,nombres] of Object.entries(aliases)){
    const i=headers.findIndex(h=>nombres.includes(h));
    if(i>=0)colIdx[campo]=i;
  }
  // si falta algún campo clave no reconocemos el encabezado: se cae al mapeo posicional de siempre
  if(requeridos.some(c=>colIdx[c]===undefined))return mapRows(rawRows,fallbackCols,headerKeyword);
  const out=[];
  for(let i=headerIdx+1;i<rawRows.length;i++){
    const row=rawRows[i];
    if(!row||row.every(c=>c===''||c==null))continue;
    const obj={};
    for(const campo of Object.keys(aliases)){
      const v=colIdx[campo]!==undefined?row[colIdx[campo]]:undefined;
      obj[campo]=v!==undefined?v:'';
    }
    out.push(obj);
  }
  return out;
}
function normalizePct(v){
  // El Excel real guarda "% Comisión" como fracción (0.05 = 5%), no como "5". Cualquier
  // valor <=1 se interpreta como fracción y se pasa a porcentaje entero (para que coincida
  // con la escala de vendedores.pct_comision, que guarda 5, 7.5, 10, 30...).
  const n=parseNum(v);
  return (n>0&&n<=1)?n*100:n;
}

let PARSED=null; // { detalle:[], sinComision:[], excluidos:[], sheetsFound:{...} }

function resolveVendorName(nombreCrudo,tasaCruda){
  // "Ruben" sin aclarar tasa (formato nuevo): matchea contra "Ruben (7,5%)"/"Ruben (10%)" según
  // la columna Tasa de esa fila puntual — cada vendedor conserva su cuenta corriente separada.
  const nombre=String(nombreCrudo||'').trim();
  if(normKey(nombre)!=='ruben')return nombre;
  const tasaPct=normalizePct(tasaCruda);
  const candidatos=DB.vendedores.filter(v=>normKey(v.nombre_mostrar).startsWith('ruben'));
  const match=candidatos.find(v=>Math.abs(v.pct_comision-tasaPct)<0.01);
  return match?match.nombre_mostrar:nombre;
}

function parseWorkbook(wb){
  const detSheet=findSheetName(wb,SHEET_KEYWORDS.detalle);
  const scSheet=findSheetName(wb,SHEET_KEYWORDS.sinComision);
  const excSheet=findSheetName(wb,SHEET_KEYWORDS.excluidos);
  if(!detSheet)throw new Error('No encontré la hoja "Detalle" en el Excel. Hojas disponibles: '+wb.SheetNames.join(', '));

  // Si aparece una hoja separada de Sin Comisión o Excluidos, es el formato viejo (4 hojas).
  // Si no, es el formato nuevo (una sola hoja "Detalle" ya pulida a mano).
  const res=(scSheet||excSheet)?parseWorkbookV1(wb,detSheet,scSheet,excSheet):parseWorkbookV2(wb,detSheet);
  return descartarVendedoresInactivos(res);
}

// Los vendedores marcados activo=false en la tabla `vendedores` (ej. Laura Aguado, que se liquida
// aparte) no se liquidan en esta app: sus filas se descartan al importar y el preview avisa
// cuántas fueron, para que no queden como "a revisar" ni sumen comisiones sin querer.
function descartarVendedoresInactivos(res){
  const ignorados={};
  const filtrar=filas=>filas.filter(r=>{
    const v=findVendedor(r.vendedor_nombre);
    if(v&&!v.activo){ignorados[v.nombre_mostrar]=(ignorados[v.nombre_mostrar]||0)+1;return false;}
    return true;
  });
  res.detalle=filtrar(res.detalle);
  res.sinComision=filtrar(res.sinComision);
  res.ignorados=ignorados;
  return res;
}

function parseWorkbookV1(wb,detSheet,scSheet,excSheet){
  const detalleRaw=mapRowsByHeader(sheetRows(wb.Sheets[detSheet]),'Vendedor',ALIAS_DETALLE_V1,COLS_DETALLE_V1,['vendedor','importe_pago','comision_a_pagar']);
  const sinComisionRaw=scSheet?mapRowsByHeader(sheetRows(wb.Sheets[scSheet]),'Vendedor',ALIAS_SIN_COMISION,COLS_SIN_COMISION):[];
  const excluidosRaw=excSheet?mapRows(sheetRows(wb.Sheets[excSheet]),COLS_EXCLUIDOS,'Cliente'):[];

  const detalle=detalleRaw.map(r=>({
    vendedor_nombre:resolveVendorName(r.vendedor,r.pct_comision),
    empresa:String(r.empresa||'').trim(),
    fecha_pago:parseFechaCell(r.fecha),
    cliente:String(r.cliente||'').trim(),
    nro_pago:String(r.nro_pago||'').trim(),
    tipo_doc:String(r.tipo_doc||'').trim(),
    nro_documento:String(r.nro_documento||'').trim(),
    importe_pago:parseNum(r.importe_pago),
    neto_documento:parseNum(r.neto_documento),
    total_documento:parseNum(r.total_documento),
    base_comisionable:parseNum(r.base_comisionable),
    pct_comision:normalizePct(r.pct_comision),
    comision_a_pagar:parseNum(r.comision_a_pagar)
  })).filter(r=>(r.vendedor_nombre||r.cliente)&&normKey(r.vendedor_nombre)!=='total');

  // "Sin Comisión - Revisar": en la versión pulida a mano, las filas que ya traen A/B + Comisión
  // a Pagar son comisiones resueltas (pasan a Detalle, igual que en el formato nuevo); las que
  // quedan en blanco siguen "a revisar". En la salida cruda vieja (sin esas columnas) todas
  // quedan "a revisar", como siempre.
  const sinComision=[];
  sinComisionRaw.forEach(r=>{
    const vendedor_nombre=resolveVendorName(r.vendedor,r.pct);
    if(!vendedor_nombre&&!String(r.cliente||'').trim())return;
    if(normKey(vendedor_nombre)==='total')return;
    const empresa=String(r.empresa||'').trim();
    const fecha_pago=parseFechaCell(r.fecha);
    const cliente=String(r.cliente||'').trim();
    const nro_pago=String(r.nro_pago||'').trim();
    const categoria=String(r.categoria||'').trim();
    let doc=String(r.nro_documento||'').trim();
    if(doc==='-')doc='';
    // La salida cruda no trae N° Documento: se usa la primera parte del motivo (ej. "Saldo
    // migración", "Anticipo sin aplicar") en vez del texto explicativo completo.
    const motivoOrig=String(r.motivo||'').trim();
    const motivoCorto=motivoOrig.split(/\s+-\s+|:\s/)[0].trim();
    const documento=[categoria,doc].filter(Boolean).join(' — ')||motivoCorto;
    const tipoAB=String(r.tipo_ab||'').trim();
    const pct=normalizePct(r.pct);
    const importe=parseNum(r.importe);
    const resuelta=r.comision!==''&&r.comision!=null&&tipoAB!=='';
    if(resuelta){
      const comision=parseNum(r.comision);
      const base=(r.base!==''&&r.base!=null)?parseNum(r.base):(pct>0?comision/(pct/100):0);
      detalle.push({vendedor_nombre,empresa,fecha_pago,cliente,nro_pago,tipo_doc:tipoAB,nro_documento:documento,
        importe_pago:importe,neto_documento:null,total_documento:null,base_comisionable:base,pct_comision:pct,comision_a_pagar:comision});
    }else{
      sinComision.push({vendedor_nombre,empresa,fecha_pago,cliente,nro_pago,
        motivo:'Comisión sin definir todavía'+(documento?' — '+documento:''),
        importe,aplica:tipoAB});
    }
  });

  const excluidos=excluidosRaw.map(r=>({
    cliente:String(r.cliente||'').trim(),
    motivo:String(r.motivo||'').trim(),
    empresa:String(r.empresa||'').trim(),
    fecha_pago:parseFechaCell(r.fecha),
    nro_pago:String(r.nro_pago||'').trim(),
    importe:parseNum(r.importe)
  })).filter(r=>(r.cliente||r.motivo)&&normKey(r.cliente)!=='total');

  return {detalle,sinComision,excluidos,sheetsFound:{detSheet,scSheet,excSheet,formatVersion:'v1'}};
}

function parseWorkbookV2(wb,detSheet){
  const rows=mapRows(sheetRows(wb.Sheets[detSheet]),COLS_DETALLE_V2,'Vendedor')
    .filter(r=>String(r.vendedor||'').trim()||String(r.cliente||'').trim());

  const detalle=[],sinComision=[];
  rows.forEach(r=>{
    const vendedor_nombre=resolveVendorName(r.vendedor,r.tasa);
    const empresa=String(r.empresa||'').trim();
    const fecha_pago=parseFechaCell(r.fecha);
    const cliente=String(r.cliente||'').trim();
    const nro_pago=String(r.nro_pago||'').trim();
    const documento=String(r.documento||'').trim();
    const tipoAB=String(r.tipo_ab||'').trim();
    const pct_comision=normalizePct(r.tasa);
    const importe_pago=parseNum(r.importe);
    const sinDefinir=r.comision===''||r.comision==null;
    if(sinDefinir){
      sinComision.push({vendedor_nombre,empresa,fecha_pago,cliente,nro_pago,motivo:'Comisión sin definir todavía'+(documento?' — '+documento:''),importe:importe_pago,aplica:tipoAB});
    }else{
      const comision_a_pagar=parseNum(r.comision);
      detalle.push({
        vendedor_nombre,empresa,fecha_pago,cliente,nro_pago,
        tipo_doc:tipoAB,
        nro_documento:documento,
        importe_pago,
        neto_documento:null,
        total_documento:null,
        base_comisionable:pct_comision>0?comision_a_pagar/(pct_comision/100):0,
        pct_comision,
        comision_a_pagar
      });
    }
  });

  return {detalle,sinComision,excluidos:[],sheetsFound:{detSheet,scSheet:null,excSheet:null,formatVersion:'v2'}};
}

function inferPeriodo(parsed){
  const fechas=[...parsed.detalle,...parsed.sinComision,...parsed.excluidos].map(r=>r.fecha_pago).filter(Boolean);
  if(!fechas.length)return null;
  const counts={};
  fechas.forEach(f=>{const k=f.slice(0,7);counts[k]=(counts[k]||0)+1;});
  const best=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
  const [y,m]=best.split('-');
  return {anio:parseInt(y,10),mes:parseInt(m,10)};
}

async function onCargaFile(ev){
  const file=ev.target.files[0];
  if(!file)return;
  document.getElementById('carga-file-label').textContent='📄 '+file.name;
  const prevEl=document.getElementById('carga-preview');
  prevEl.innerHTML='<div class="loading">Leyendo archivo...</div>';
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    PARSED=parseWorkbook(wb);
    PARSED.archivoNombre=file.name;
    const periodo=inferPeriodo(PARSED);
    if(periodo){document.getElementById('carga-mes').value=periodo.mes;document.getElementById('carga-anio').value=periodo.anio;}
    renderCargaPreview();
  }catch(e){
    prevEl.innerHTML='<div class="alert alert-red">Error al leer el archivo: '+esc(e.message)+'</div>';
    PARSED=null;
  }
}

function renderCargaPreview(){
  const prevEl=document.getElementById('carga-preview');
  if(!PARSED){prevEl.innerHTML='';return;}
  const {detalle,sinComision,excluidos,sheetsFound}=PARSED;

  // Resumen por vendedor calculado a partir del detalle parseado
  const porVendedor={};
  detalle.forEach(r=>{
    const key=r.vendedor_nombre||'(sin nombre)';
    if(!porVendedor[key])porVendedor[key]={cant:0,base:0,comision:0,conocido:!!findVendedor(key)};
    porVendedor[key].cant++;porVendedor[key].base+=r.base_comisionable;porVendedor[key].comision+=r.comision_a_pagar;
  });
  const desconocidos=Object.keys(porVendedor).filter(k=>!porVendedor[k].conocido);
  const totalComision=detalle.reduce((a,r)=>a+r.comision_a_pagar,0);
  const totalBase=detalle.reduce((a,r)=>a+r.base_comisionable,0);

  let warns='';
  if(sheetsFound.formatVersion==='v1'){
    if(!sheetsFound.scSheet)warns+='<div class="alert alert-amber">No encontré la hoja "Sin Comisión - Revisar" — se guardará vacía.</div>';
    if(!sheetsFound.excSheet)warns+='<div class="alert alert-amber">No encontré la hoja "Excluidos" — se guardará vacía.</div>';
  }
  const ignorados=PARSED.ignorados||{};
  if(Object.keys(ignorados).length)warns+='<div class="alert alert-gray" style="background:#f5f5f5;color:#555;border:1px solid #e0e0e0">Se ignoraron filas de vendedores que no se liquidan acá (inactivos): <b>'+Object.entries(ignorados).map(([n,c])=>esc(n)+' ('+c+')').join(', ')+'</b>.</div>';
  const conImporteCero=detalle.filter(r=>r.importe_pago===0).length+sinComision.filter(r=>r.importe===0).length;
  if(conImporteCero)warns+='<div class="alert alert-amber">Hay <b>'+conImporteCero+'</b> pago(s) con importe $0 — puede que las columnas del Excel no coincidan con lo esperado. Revisá el preview antes de confirmar.</div>';
  if(desconocidos.length)warns+='<div class="alert alert-red">Vendedor(es) en el Excel que no están en la tabla de vendedores: <b>'+desconocidos.map(esc).join(', ')+'</b>. Revisá el nombre exacto o agregalo en la tabla <code>vendedores</code> antes de confirmar (si confirmás igual, sus comisiones se guardan pero no van a sumar en la cuenta corriente hasta que coincida el nombre).</div>';

  prevEl.innerHTML=`
    <p class="small">Formato detectado: ${sheetsFound.formatVersion==='v2'?'nuevo (una hoja "Detalle" pulida a mano)':'viejo (4 hojas)'}</p>
    ${warns}
    <div class="grid4" style="margin:16px 0">
      <div class="metric"><div class="metric-label">Pagos comisionados</div><div class="metric-value">${detalle.length}</div></div>
      <div class="metric"><div class="metric-label">Base comisionable</div><div class="metric-value">${fmt(totalBase)}</div></div>
      <div class="metric"><div class="metric-label">Comisión total</div><div class="metric-value">${fmt(totalComision)}</div></div>
      <div class="metric"><div class="metric-label">A revisar / excluidos</div><div class="metric-value">${sinComision.length} / ${excluidos.length}</div></div>
    </div>
    <div class="table-wrap" style="margin-bottom:16px">
      <table><thead><tr><th>Vendedor</th><th>Cant. Pagos</th><th>Base Comisionable</th><th>Comisión</th></tr></thead>
      <tbody>${Object.entries(porVendedor).map(([k,v])=>'<tr><td>'+esc(k)+(v.conocido?'':' <span class="badge badge-red">no reconocido</span>')+'</td><td>'+v.cant+'</td><td>'+fmt(v.base)+'</td><td>'+fmt(v.comision)+'</td></tr>').join('')}</tbody></table>
    </div>
    <div style="text-align:right;display:flex;gap:8px;justify-content:flex-end">
      <button onclick="cancelarCarga()">Cancelar</button>
      <button class="primary" onclick="confirmarCarga()">Confirmar y guardar</button>
    </div>
  `;
}
function cancelarCarga(){PARSED=null;rCargarTab();}

async function confirmarCarga(){
  if(!PARSED)return;
  const mes=parseInt(document.getElementById('carga-mes').value,10);
  const anio=parseInt(document.getElementById('carga-anio').value,10);
  const prevEl=document.getElementById('carga-preview');
  prevEl.innerHTML='<div class="loading">Guardando...</div>';
  try{
    const existentes=await sbFetch('liquidaciones?mes=eq.'+mes+'&anio=eq.'+anio+'&select=*');
    let liq;
    if(existentes.length){
      liq=existentes[0];
      const gruposExistentes=await sbFetch('liquidacion_vendedores?liquidacion_id=eq.'+liq.id+'&select=estado');
      const yaDecididos=gruposExistentes.filter(g=>g.estado!=='pendiente');
      if(yaDecididos.length){
        prevEl.innerHTML='<div class="alert alert-red">Ya existe una liquidación de '+MESES[mes-1]+' '+anio+' con '+yaDecididos.length+' vendedor(es) ya aprobado(s)/rechazado(s). No se puede sobreescribir desde acá — si hace falta corregir, avisá para hacerlo a mano.</div>';
        return;
      }
      if(!confirm('Ya existe una carga pendiente para '+MESES[mes-1]+' '+anio+'. ¿Reemplazarla con este archivo?')){renderCargaPreview();return;}
      await sbFetch('liquidacion_detalle?liquidacion_id=eq.'+liq.id,{method:'DELETE'});
      await sbFetch('liquidacion_sin_comision?liquidacion_id=eq.'+liq.id,{method:'DELETE'});
      await sbFetch('liquidacion_excluidos?liquidacion_id=eq.'+liq.id,{method:'DELETE'});
      await sbFetch('liquidacion_vendedores?liquidacion_id=eq.'+liq.id,{method:'DELETE'});
      await sbFetch('liquidaciones?id=eq.'+liq.id,{method:'PATCH',body:JSON.stringify({archivo_nombre:PARSED.archivoNombre,cargado_por:CU.label,created_at:new Date().toISOString()})});
    }else{
      const rows=await sbFetch('liquidaciones',{method:'POST',body:JSON.stringify({mes,anio,archivo_nombre:PARSED.archivoNombre,cargado_por:CU.label})});
      liq=rows[0];
    }
    const chunk=(arr,n)=>{const out=[];for(let i=0;i<arr.length;i+=n)out.push(arr.slice(i,i+n));return out;};
    for(const part of chunk(PARSED.detalle.map(r=>({...r,liquidacion_id:liq.id})),500)){
      if(part.length)await sbFetch('liquidacion_detalle',{method:'POST',body:JSON.stringify(part)});
    }
    for(const part of chunk(PARSED.sinComision.map(r=>({...r,liquidacion_id:liq.id})),500)){
      if(part.length)await sbFetch('liquidacion_sin_comision',{method:'POST',body:JSON.stringify(part)});
    }
    for(const part of chunk(PARSED.excluidos.map(r=>({...r,liquidacion_id:liq.id})),500)){
      if(part.length)await sbFetch('liquidacion_excluidos',{method:'POST',body:JSON.stringify(part)});
    }
    // Un grupo por vendedor (unión de Detalle + Sin Comisión) para poder aprobar/rechazar por separado.
    const vendedoresDelMes=new Set([...PARSED.detalle.map(r=>r.vendedor_nombre),...PARSED.sinComision.map(r=>r.vendedor_nombre)].filter(Boolean));
    const gruposVendedor=[...vendedoresDelMes].map(vendedor_nombre=>({liquidacion_id:liq.id,vendedor_nombre}));
    for(const part of chunk(gruposVendedor,500)){
      if(part.length)await sbFetch('liquidacion_vendedores',{method:'POST',body:JSON.stringify(part)});
    }
    PARSED=null;
    sTab('historial');
    setTimeout(()=>verLiquidacion(liq.id),50);
  }catch(e){
    prevEl.innerHTML='<div class="alert alert-red">Error al guardar: '+esc(e.message)+'</div>';
  }
}

function badgeEstado(e){
  if(e==='pagada')return '<span class="badge badge-purple">Pagada</span>';
  if(e==='aprobada')return '<span class="badge badge-green">Aprobada</span>';
  if(e==='rechazada')return '<span class="badge badge-red">Rechazada</span>';
  return '<span class="badge badge-amber">Pendiente</span>';
}
function badgeResumenGrupos(r){
  if(!r)return '<span class="badge badge-gray">Sin vendedores</span>';
  const total=r.pendiente+r.aprobada+r.rechazada;
  if(r.aprobada===total)return '<span class="badge badge-green">Aprobada ('+total+'/'+total+')</span>';
  if(r.rechazada===total)return '<span class="badge badge-red">Rechazada ('+total+'/'+total+')</span>';
  if(r.pendiente===total)return '<span class="badge badge-amber">Pendiente</span>';
  return '<span class="badge badge-amber">Parcial — '+r.aprobada+' aprob. / '+r.rechazada+' rech. / '+r.pendiente+' pend.</span>';
}

async function verLiquidacion(id){
  document.getElementById('mc').innerHTML='<div class="loading">Cargando...</div>';
  try{
    const [liqs,detalle,sinComision,grupos]=await Promise.all([
      sbFetch('liquidaciones?id=eq.'+id+'&select=*'),
      sbFetch('liquidacion_detalle?liquidacion_id=eq.'+id+'&select=*&order=vendedor_nombre.asc,cliente.asc'),
      sbFetch('liquidacion_sin_comision?liquidacion_id=eq.'+id+'&select=*&order=vendedor_nombre.asc'),
      sbFetch('liquidacion_vendedores?liquidacion_id=eq.'+id+'&select=*'),
    ]);
    const liq=liqs[0];
    if(!liq){document.getElementById('mc').innerHTML='<div class="alert alert-red">No encontré esa liquidación.</div>';return;}
    const grupoPorVendedor={};
    grupos.forEach(g=>{grupoPorVendedor[g.vendedor_nombre]=g;});

    // Resumen por vendedor: siempre los 17 (activos), + los que aparezcan sin match.
    const resumen={};
    DB.vendedores.filter(v=>v.activo).forEach(v=>{resumen[v.nombre_mostrar]={pct:v.pct_comision,cantCom:0,base:0,comision:0,cantRev:0,baseRev:0};});
    detalle.forEach(r=>{
      if(!resumen[r.vendedor_nombre])resumen[r.vendedor_nombre]={pct:r.pct_comision,cantCom:0,base:0,comision:0,cantRev:0,baseRev:0};
      resumen[r.vendedor_nombre].cantCom++;resumen[r.vendedor_nombre].base+=r.base_comisionable;resumen[r.vendedor_nombre].comision+=r.comision_a_pagar;
    });
    sinComision.forEach(r=>{
      const key=r.vendedor_nombre||'(sin vendedor)';
      if(!resumen[key])resumen[key]={pct:null,cantCom:0,base:0,comision:0,cantRev:0,baseRev:0};
      resumen[key].cantRev++;resumen[key].baseRev+=r.importe;
    });
    const totales=Object.values(resumen).reduce((a,v)=>({base:a.base+v.base,comision:a.comision+v.comision,cantCom:a.cantCom+v.cantCom,cantRev:a.cantRev+v.cantRev,baseRev:a.baseRev+v.baseRev}),{base:0,comision:0,cantCom:0,cantRev:0,baseRev:0});

    const pendientesCount=grupos.filter(g=>g.estado==='pendiente').length;

    document.getElementById('mc').innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <h2 class="section-title" style="margin-bottom:0">${MESES[liq.mes-1]} ${liq.anio}</h2>
        ${badgeResumenGrupos({pendiente:grupos.filter(g=>g.estado==='pendiente').length,aprobada:grupos.filter(g=>g.estado==='aprobada').length,rechazada:grupos.filter(g=>g.estado==='rechazada').length})}
      </div>
      <p class="small" style="margin-bottom:16px">Cargado por ${esc(liq.cargado_por||'—')} el ${new Date(liq.created_at).toLocaleDateString('es-AR')}${liq.archivo_nombre?' · archivo: '+esc(liq.archivo_nombre):''}</p>
      <p class="small" style="margin-bottom:16px">La aprobación es <b>por vendedor</b> — mirá la columna Acción en la tabla de abajo.${pendientesCount>1?' <span class="link" onclick="aprobarTodosPendientes('+id+')">Aprobar los '+pendientesCount+' pendientes de un saque →</span>':''}</p>

      <h3 style="font-size:15px;font-weight:600;margin:20px 0 10px">Resumen por Vendedor</h3>
      <div class="table-wrap" style="margin-bottom:20px"><table><thead><tr><th>Vendedor</th><th>%</th><th>Pagos c/comisión</th><th>Base Comisionable</th><th>Comisión a Pagar</th><th>Pagos a revisar</th><th>Base pendiente</th><th></th><th>Estado</th><th>Acción</th></tr></thead>
      <tbody>
        ${Object.entries(resumen).map(([k,v])=>{
          const g=grupoPorVendedor[k];
          let accion='';
          if(g){
            if(g.estado==='pendiente')accion='<button class="danger" style="font-size:12px;padding:4px 10px" onclick="rechazarGrupoVendedor('+g.id+')">Rechazar</button> <button class="success" style="font-size:12px;padding:4px 10px" onclick="aprobarGrupoVendedor('+g.id+')">Aprobar</button>';
            else if(g.estado==='aprobada'&&!g.pagado)accion='<button style="font-size:12px;padding:4px 10px;color:#6a1b9a;border-color:#ce93d8" onclick="marcarPagadoGrupo('+g.id+')">Marcar pagada</button>';

// Comisión de un vendedor dentro de la liquidación: un único modal con TODO junto (ya
// comisionado + a revisar), reemplaza las tablas planas de "Detalle" y "Sin Comisión". El Tipo de
// cualquier fila (incluidas las ya resueltas) se puede cambiar ahí mismo — es reversible, elegir
// "— Elegir —" en una fila ya resuelta la vuelve a mandar a "sin comisión". Nada se guarda hasta
// tocar "Guardar cambios" (se activa solo cuando hay algo tocado).
//
// Divisor sobre el Importe según el tipo, mismo criterio que el pulido manual en Excel (validado
// contra datos reales de agosto 2026): A = Factura (21% IVA), B = NOF (sin IVA, importe completo),
// A/B = mixto (10,5%, la mitad de 21%). CHR (cheque rechazado) es comisión $0 fija, sin divisor.
const TIPO_DIVISOR={'A':1.21,'B':1,'A/B':1.105};
const TIPOS_VALIDOS=['A','B','A/B','CHR'];
function calcularComisionTipo(tipo,importe,pct){
  if(tipo==='CHR')return {base:0,comision:0};
  const div=TIPO_DIVISOR[tipo];
  if(!div)return null;
  const base=importe/div;
  return {base,comision:base*(pct/100)};
}
function calcTextoComision(tipo,importe,pct){
  if(!tipo)return '—';
  const r=calcularComisionTipo(tipo,importe,pct);
  return r?fmt(r.comision)+' (base '+fmt(r.base)+')':'—';
}
let COMISION_CTX={};

async function verComisionVendedor(grupoId){
  try{
    const grupos=await sbFetch('liquidacion_vendedores?id=eq.'+grupoId+'&select=*');
    const g=grupos[0];
    if(!g)return;
    const [detRows,revRows]=await Promise.all([
      sbFetch('liquidacion_detalle?liquidacion_id=eq.'+g.liquidacion_id+'&vendedor_nombre=eq.'+encodeURIComponent(g.vendedor_nombre)+'&select=*'),
      sbFetch('liquidacion_sin_comision?liquidacion_id=eq.'+g.liquidacion_id+'&vendedor_nombre=eq.'+encodeURIComponent(g.vendedor_nombre)+'&select=*'),
    ]);
    const vendedor=findVendedor(g.vendedor_nombre);
    const pctVendedor=vendedor?vendedor.pct_comision:0;

    COMISION_CTX={};
    const filas=[];
    detRows.forEach(r=>{
      const key='d'+r.id;
      const tipo=TIPOS_VALIDOS.includes(r.tipo_doc)?r.tipo_doc:'';
      COMISION_CTX[key]={origin:'detalle',rowId:r.id,liquidacion_id:g.liquidacion_id,vendedor_nombre:g.vendedor_nombre,
        empresa:r.empresa,fecha_pago:r.fecha_pago,cliente:r.cliente,nro_pago:r.nro_pago,documento:r.nro_documento,
        importe:r.importe_pago,pct:r.pct_comision,original:tipo,current:tipo};
      filas.push(key);
    });
    revRows.forEach(r=>{
      const key='s'+r.id;
      const documento=String(r.motivo||'').replace(/^Comisión sin definir todavía( — )?/,'');
      COMISION_CTX[key]={origin:'sin_comision',rowId:r.id,liquidacion_id:g.liquidacion_id,vendedor_nombre:g.vendedor_nombre,
        empresa:r.empresa,fecha_pago:r.fecha_pago,cliente:r.cliente,nro_pago:r.nro_pago,documento,
        importe:r.importe,pct:pctVendedor,original:'',current:''};
      filas.push(key);
    });
    filas.sort((a,b)=>(COMISION_CTX[a].cliente||'').localeCompare(COMISION_CTX[b].cliente||''));

    const opcionesTipo=t=>['','A','B','A/B','CHR'].map(v=>'<option value="'+v+'"'+(v===t?' selected':'')+'>'+(v===''?'— Elegir —':v==='A'?'A · Factura':v==='B'?'B · NOF':v==='A/B'?'A/B · Mixto':'CHR · Rechazado')+'</option>').join('');

    document.getElementById('modal').innerHTML=`
      <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal" style="max-width:1050px">
          <div class="modal-title">${esc(g.vendedor_nombre)} — comisión de este mes</div>
          <p class="small" style="margin-bottom:12px">Podés cambiar el Tipo de cualquier fila (incluidas las ya resueltas) — es reversible, elegir "— Elegir —" la vuelve a mandar a revisar. No se guarda nada hasta tocar "Guardar cambios".</p>
          <div class="table-wrap" style="margin-bottom:16px;max-height:420px;overflow-y:auto"><table><thead><tr><th>Empresa</th><th>Fecha</th><th>Cliente</th><th>N° Pago</th><th>Doc. / Motivo</th><th>Importe</th><th>Tipo</th><th>Comisión</th></tr></thead>
          <tbody>${filas.length===0?'<tr><td colspan="8" class="small" style="white-space:normal">Sin filas.</td></tr>':filas.map(key=>{
            const c=COMISION_CTX[key];
            return `<tr id="crow-${key}"${c.original?'':' style="background:#fff5f5"'}>
              <td>${esc(c.empresa)}</td><td>${fmtFecha(c.fecha_pago)}</td><td>${esc(c.cliente)}</td><td>${esc(c.nro_pago)}</td><td>${esc(c.documento)}</td><td>${fmt(c.importe)}</td>
              <td><select id="ctipo-${key}" style="width:auto" onchange="onCambioTipoComision('${key}')">${opcionesTipo(c.original)}</select></td>
              <td id="ccalc-${key}" class="small">${calcTextoComision(c.original,c.importe,c.pct)}</td>
            </tr>`;
          }).join('')}</tbody></table></div>
          <div style="text-align:right;display:flex;gap:8px;justify-content:flex-end">
            <button onclick="closeModal()">Cerrar</button>
            <button class="success" id="cguardar-btn" disabled onclick="guardarCambiosComision(${g.liquidacion_id})">Guardar cambios</button>
          </div>
        </div>
      </div>`;
  }catch(e){alert('Error: '+e.message);}
}
function onCambioTipoComision(key){
  const ctx=COMISION_CTX[key];
  if(!ctx)return;
  ctx.current=document.getElementById('ctipo-'+key).value;
  document.getElementById('ccalc-'+key).innerHTML=calcTextoComision(ctx.current,ctx.importe,ctx.pct);
  const dirty=ctx.current!==ctx.original;
  const row=document.getElementById('crow-'+key);
  if(row)row.style.background=dirty?'#fff8e1':(ctx.original?'':'#fff5f5');
  const n=Object.values(COMISION_CTX).filter(c=>c.current!==c.original).length;
  const btn=document.getElementById('cguardar-btn');
  if(btn){btn.disabled=n===0;btn.textContent=n>0?'Guardar cambios ('+n+')':'Guardar cambios';}
}
async function guardarCambiosComision(liquidacionId){
  const cambios=Object.values(COMISION_CTX).filter(c=>c.current!==c.original);
  if(!cambios.length)return;
  if(!confirm('¿Guardar '+cambios.length+' cambio(s)?'))return;
  const btn=document.getElementById('cguardar-btn');
  if(btn){btn.disabled=true;btn.textContent='Guardando...';}
  try{
    for(const ctx of cambios){
      if(ctx.current&&ctx.origin==='sin_comision'){
        // se resuelve: pasa de "Sin Comisión" a "Detalle"
        const r=calcularComisionTipo(ctx.current,ctx.importe,ctx.pct);
        await sbFetch('liquidacion_detalle',{method:'POST',body:JSON.stringify({
          liquidacion_id:ctx.liquidacion_id,vendedor_nombre:ctx.vendedor_nombre,empresa:ctx.empresa,
          fecha_pago:ctx.fecha_pago,cliente:ctx.cliente,nro_pago:ctx.nro_pago,tipo_doc:ctx.current,
          nro_documento:ctx.documento,importe_pago:ctx.importe,neto_documento:null,total_documento:null,
          base_comisionable:r.base,pct_comision:ctx.pct,comision_a_pagar:r.comision
        })});
        await sbFetch('liquidacion_sin_comision?id=eq.'+ctx.rowId,{method:'DELETE'});
      }else if(ctx.current&&ctx.origin==='detalle'){
        // ya estaba resuelta, se reclasifica a otro tipo
        const r=calcularComisionTipo(ctx.current,ctx.importe,ctx.pct);
        await sbFetch('liquidacion_detalle?id=eq.'+ctx.rowId,{method:'PATCH',body:JSON.stringify({tipo_doc:ctx.current,base_comisionable:r.base,comision_a_pagar:r.comision})});
      }else if(!ctx.current&&ctx.origin==='detalle'){
        // se revierte: vuelve de "Detalle" a "Sin Comisión"
        await sbFetch('liquidacion_sin_comision',{method:'POST',body:JSON.stringify({
          liquidacion_id:ctx.liquidacion_id,vendedor_nombre:ctx.vendedor_nombre,empresa:ctx.empresa,
          fecha_pago:ctx.fecha_pago,cliente:ctx.cliente,nro_pago:ctx.nro_pago,
          motivo:'Comisión sin definir todavía'+(ctx.documento?' — '+ctx.documento:''),importe:ctx.importe,aplica:''
        })});
        await sbFetch('liquidacion_detalle?id=eq.'+ctx.rowId,{method:'DELETE'});
      }
    }
    closeModal();
    verLiquidacion(liquidacionId);
  }catch(e){alert('Error: '+e.message);if(btn){btn.disabled=false;btn.textContent='Guardar cambios';}}
}

        <div id="${gid}" class="hidden" style="margin-top:12px">
          <div class="table-wrap"><table><thead><tr><th>Motivo</th><th>Empresa</th><th>Fecha</th><th>N° Pago</th><th>Importe</th></tr></thead>
          <tbody>${d.rows.map(r=>'<tr><td>'+esc(r.motivo)+'</td><td>'+esc(r.empresa)+'</td><td>'+fmtFecha(r.fecha_pago)+'</td><td>'+esc(r.nro_pago)+'</td><td>'+fmt(r.importe)+'</td></tr>').join('')}</tbody></table></div>
        </div>
      </div>`;
    }).join('');
  }catch(e){el.innerHTML='<div class="alert alert-red">Error: '+esc(e.message)+'</div>';}
}

// ============================================================
// TAB: VENDEDORES / CUENTA CORRIENTE
// ============================================================
async function rVendedoresTab(){
  document.getElementById('mc').innerHTML='<div class="loading">Cargando...</div>';
  try{
    const [gruposAprobados,detalle,pagos]=await Promise.all([
      sbFetch('liquidacion_vendedores?select=liquidacion_id,vendedor_nombre&estado=eq.aprobada'),
      sbFetch('liquidacion_detalle?select=vendedor_nombre,comision_a_pagar,liquidacion_id'),
      sbFetch('pagos_vendedor?select=*'),
    ]);
    const aprobadoKeys=new Set(gruposAprobados.map(g=>g.liquidacion_id+'|'+g.vendedor_nombre));
    const acumPorVendedor={},pagadoPorVendedor={};
    detalle.forEach(r=>{
      if(!aprobadoKeys.has(r.liquidacion_id+'|'+r.vendedor_nombre))return;
      acumPorVendedor[r.vendedor_nombre]=(acumPorVendedor[r.vendedor_nombre]||0)+r.comision_a_pagar;
    });
    pagos.forEach(p=>{pagadoPorVendedor[p.vendedor_nombre]=(pagadoPorVendedor[p.vendedor_nombre]||0)+p.importe;});

    const vendedores=DB.vendedores.filter(v=>v.activo);
    document.getElementById('mc').innerHTML=`
      <h2 class="section-title">Vendedores — Cuenta Corriente</h2>
      <div class="table-wrap"><table><thead><tr><th>Vendedor</th><th>%</th><th>Comisión acumulada (aprobada)</th><th>Pagado</th><th>Saldo</th><th></th></tr></thead>
      <tbody>${vendedores.map(v=>{
        const acum=acumPorVendedor[v.nombre_mostrar]||0,pagado=pagadoPorVendedor[v.nombre_mostrar]||0,saldo=acum-pagado;
        return '<tr><td>'+esc(v.nombre_mostrar)+'</td><td>'+v.pct_comision+'%</td><td>'+fmt(acum)+'</td><td>'+fmt(pagado)+'</td><td class="'+(saldo>0?'saldo-pos':'saldo-zero')+'">'+fmt(saldo)+'</td><td><button onclick="verVendedor('+v.id+')">Ver →</button></td></tr>';
      }).join('')}</tbody></table></div>
    `;
  }catch(e){document.getElementById('mc').innerHTML='<div class="loading" style="color:#c00">Error: '+esc(e.message)+'</div>';}
}

async function verVendedor(vendedorId){
  const v=DB.vendedores.find(x=>x.id===vendedorId);
  if(!v)return;
  document.getElementById('mc').innerHTML='<div class="loading">Cargando...</div>';
  try{
    const [liqsTodas,gruposAprobados,detalle,pagos]=await Promise.all([
      sbFetch('liquidaciones?select=*&order=anio.desc,mes.desc'),
      sbFetch('liquidacion_vendedores?select=liquidacion_id&estado=eq.aprobada&vendedor_nombre=eq.'+encodeURIComponent(v.nombre_mostrar)),
      sbFetch('liquidacion_detalle?select=liquidacion_id,comision_a_pagar,base_comisionable&vendedor_nombre=eq.'+encodeURIComponent(v.nombre_mostrar)),
      sbFetch('pagos_vendedor?select=*&vendedor_nombre=eq.'+encodeURIComponent(v.nombre_mostrar)+'&order=fecha.desc'),
    ]);
    const idsAprobados=new Set(gruposAprobados.map(g=>g.liquidacion_id));
    const liqs=liqsTodas.filter(l=>idsAprobados.has(l.id));
    const porLiq={};
    detalle.forEach(r=>{if(!idsAprobados.has(r.liquidacion_id))return;if(!porLiq[r.liquidacion_id])porLiq[r.liquidacion_id]={base:0,comision:0};porLiq[r.liquidacion_id].base+=r.base_comisionable;porLiq[r.liquidacion_id].comision+=r.comision_a_pagar;});
    const liqsConDatos=liqs.filter(l=>porLiq[l.id]);
    const totalAcum=liqsConDatos.reduce((a,l)=>a+porLiq[l.id].comision,0);
    const totalPagado=pagos.reduce((a,p)=>a+p.importe,0);
    const saldo=totalAcum-totalPagado;

    document.getElementById('mc').innerHTML=`
      <button onclick="rVendedoresTab()" style="margin-bottom:16px">← Volver</button>
      <h2 class="section-title">${esc(v.nombre_mostrar)}</h2>
      <div class="grid4" style="margin-bottom:20px">
        <div class="metric"><div class="metric-label">% Comisión</div><div class="metric-value">${v.pct_comision}%</div></div>
        <div class="metric"><div class="metric-label">Acumulado (aprobado)</div><div class="metric-value">${fmt(totalAcum)}</div></div>
        <div class="metric"><div class="metric-label">Pagado</div><div class="metric-value">${fmt(totalPagado)}</div></div>
        <div class="metric"><div class="metric-label">Saldo</div><div class="metric-value ${saldo>0?'saldo-pos':'saldo-zero'}">${fmt(saldo)}</div></div>
      </div>
      <div style="text-align:right;margin-bottom:16px"><button class="primary" onclick="registrarPago(${v.id})">Registrar pago</button></div>

      <h3 style="font-size:15px;font-weight:600;margin-bottom:10px">Liquidaciones aprobadas</h3>
      <div class="table-wrap" style="margin-bottom:20px"><table><thead><tr><th>Período</th><th>Base Comisionable</th><th>Comisión</th></tr></thead>
      <tbody>${liqsConDatos.length===0?'<tr><td colspan="3" class="small" style="white-space:normal">Sin liquidaciones aprobadas todavía.</td></tr>':liqsConDatos.map(l=>'<tr><td>'+MESES[l.mes-1]+' '+l.anio+'</td><td>'+fmt(porLiq[l.id].base)+'</td><td>'+fmt(porLiq[l.id].comision)+'</td></tr>').join('')}</tbody></table></div>

      <h3 style="font-size:15px;font-weight:600;margin-bottom:10px">Pagos registrados</h3>
      <div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Importe</th><th>Nota</th><th>Registrado por</th></tr></thead>
      <tbody>${pagos.length===0?'<tr><td colspan="4" class="small" style="white-space:normal">Sin pagos registrados todavía.</td></tr>':pagos.map(p=>'<tr><td>'+fmtFecha(p.fecha)+'</td><td>'+fmt(p.importe)+'</td><td>'+esc(p.nota||'—')+'</td><td>'+esc(p.registrado_por||'—')+'</td></tr>').join('')}</tbody></table></div>
    `;
  }catch(e){document.getElementById('mc').innerHTML='<div class="loading" style="color:#c00">Error: '+esc(e.message)+'</div>';}
}

function registrarPago(vendedorId){
  const v=DB.vendedores.find(x=>x.id===vendedorId);
  const hoy=new Date().toISOString().slice(0,10);
  document.getElementById('modal').innerHTML=`
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-title">Registrar pago — ${esc(v.nombre_mostrar)}</div>
        <div class="form-group"><label>Fecha</label><input id="pago-fecha" type="date" value="${hoy}"></div>
        <div class="form-group"><label>Importe</label><input id="pago-importe" type="number" step="0.01" min="0"></div>
        <div class="form-group"><label>Nota (opcional)</label><input id="pago-nota" type="text"></div>
        <div id="pago-err" class="alert alert-red hidden"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="confirmarPago(${vendedorId})">Guardar</button></div>
      </div>
    </div>`;
}
async function confirmarPago(vendedorId){
  const v=DB.vendedores.find(x=>x.id===vendedorId);
  const fecha=document.getElementById('pago-fecha').value;
  const importe=parseFloat(document.getElementById('pago-importe').value);
  const nota=document.getElementById('pago-nota').value.trim();
  const err=document.getElementById('pago-err');
  if(!fecha||!importe||importe<=0){err.classList.remove('hidden');err.textContent='Completá fecha e importe (mayor a 0)';return;}
  try{
    await sbFetch('pagos_vendedor',{method:'POST',body:JSON.stringify({vendedor_nombre:v.nombre_mostrar,fecha,importe,nota:nota||null,registrado_por:CU.label})});
    closeModal();
    verVendedor(vendedorId);
  }catch(e){err.classList.remove('hidden');err.textContent='Error: '+e.message;}
}

// ============================================================
// TAB: IMPLEMENTACIONES (buzón de pedidos de mejora)
// ============================================================
async function rImplTab(){
  document.getElementById('mc').innerHTML='<div class="loading">Cargando...</div>';
  try{
    const items=await sbFetch('implementaciones?select=*&order=created_at.desc');
    const pend=items.filter(i=>i.estado==='pendiente');
    const real=items.filter(i=>i.estado==='realizada');
    document.getElementById('mc').innerHTML=`
      <h2 class="section-title">Implementaciones</h2>
      <div class="card" style="margin-bottom:24px">
        <div style="font-size:13px;font-weight:600;margin-bottom:12px;color:#666">NUEVA IMPLEMENTACIÓN</div>
        <div class="form-group"><label>Tu nombre</label><input id="impl-nombre" type="text" placeholder="Ej: Diego" maxlength="80"></div>
        <div class="form-group"><label>Título</label><input id="impl-titulo" type="text" placeholder="Título breve de la mejora" maxlength="120"></div>
        <div class="form-group"><label>Descripción</label><textarea id="impl-desc" rows="4" placeholder="Describí la mejora que necesitás..."></textarea></div>
        <div id="impl-err" class="alert alert-red hidden"></div>
        <div style="text-align:right"><button class="primary" onclick="saveImpl()">Guardar</button></div>
      </div>
      <h3 style="font-size:15px;font-weight:600;margin-bottom:12px;color:#c62828">⏳ Pendientes (${pend.length})</h3>
      <div id="impl-pend">${pend.length===0?'<p class="small" style="padding:8px 0">Sin pendientes</p>':pend.map(i=>implCard(i)).join('')}</div>
      <h3 style="font-size:15px;font-weight:600;margin:24px 0 12px;color:#2a7a0a">✓ Realizadas (${real.length})</h3>
      <div id="impl-real">${real.length===0?'<p class="small" style="padding:8px 0">Ninguna todavía</p>':real.map(i=>implCard(i)).join('')}</div>
    `;
  }catch(e){document.getElementById('mc').innerHTML='<div class="loading" style="color:#c00">Error: '+esc(e.message)+'</div>';}
}
function implCard(i){
  const fecha=new Date(i.created_at).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
  const realizada=i.estado==='realizada';
  return`<div class="impl-card ${realizada?'impl-card-realizada':''}" id="impl-card-${i.id}">
    <div class="impl-nombre">${esc(i.nombre)}</div>
    <div class="impl-titulo" onclick="toggleImpl(${i.id})">
      <span>${esc(i.titulo)}</span>
      <div style="display:flex;gap:8px;align-items:center">
        ${!realizada?`<button class="success" style="font-size:12px;padding:4px 10px" onclick="event.stopPropagation();markRealizada(${i.id})">Realizado</button>`:''}
        <span style="font-size:12px;color:#aaa">▼</span>
      </div>
    </div>
    <div id="impl-body-${i.id}" class="impl-desc hidden">${esc(i.descripcion)}<div class="impl-fecha">${fecha}</div></div>
  </div>`;
}
function toggleImpl(id){
  const el=document.getElementById('impl-body-'+id);
  if(el)el.classList.toggle('hidden');
}
async function saveImpl(){
  const nombre=document.getElementById('impl-nombre').value.trim();
  const titulo=document.getElementById('impl-titulo').value.trim();
  const desc=document.getElementById('impl-desc').value.trim();
  const err=document.getElementById('impl-err');
  if(!nombre||!titulo||!desc){err.classList.remove('hidden');err.textContent='Completá todos los campos';return;}
  try{
    await sbFetch('implementaciones',{method:'POST',body:JSON.stringify({nombre,titulo,descripcion:desc,estado:'pendiente'})});
    err.classList.add('hidden');
    rImplBadge();
    rImplTab();
  }catch(e){err.classList.remove('hidden');err.textContent='Error: '+e.message;}
}
async function markRealizada(id){
  try{
    await sbFetch('implementaciones?id=eq.'+id,{method:'PATCH',body:JSON.stringify({estado:'realizada',updated_at:new Date().toISOString()})});
    rImplBadge();
    rImplTab();
  }catch(e){alert('Error: '+e.message);}
}
function rImplBadge(){
  sbFetch('implementaciones?select=id&estado=eq.pendiente').then(r=>{
    const btn=document.getElementById('tab-implementaciones');if(!btn)return;
    const n=r.length;
    btn.innerHTML='Implementaciones'+(n>0?' <span style="background:#c62828;color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;margin-left:4px">'+n+'</span>':'');
  }).catch(()=>{});
}
</script>
</body>
