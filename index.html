// ============================================================
// SUPABASE HELPERS

async function sbFetch(path,opts={}){
  const res=await fetch(SUPABASE_URL+'/rest/v1/'+path,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation',...opts.headers},...opts});
  if(!res.ok){const e=await res.text();throw new Error(e);}
  const txt=await res.text();return txt?JSON.parse(txt):[];
}

// ============================================================
// UTILS
// ============================================================
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(n){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(n||0);}
function fmtOpt(n){return n==null?'—':fmt(n);}
function pad2(n){return String(n).padStart(2,'0');}
function normKey(s){return (s==null?'':String(s)).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
function parseNum(v){
  if(v==null||v==='')return 0;
  if(typeof v==='number')return v;
  let s=String(v).trim().replace(/\$/g,'').replace(/\s/g,'');
  if(s==='')return 0;
  const lastComma=s.lastIndexOf(','),lastDot=s.lastIndexOf('.');
  if(lastComma>-1&&lastDot>-1){
    if(lastComma>lastDot)s=s.replace(/\./g,'').replace(',','.');
    else s=s.replace(/,/g,'');
  }else if(lastComma>-1){
    s=s.replace(/\./g,'').replace(',','.');
  }
  const n=parseFloat(s);
  return isNaN(n)?0:n;
}
function parseFechaCell(v){
  if(v==null||v==='')return null;
  if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+pad2(v.getMonth()+1)+'-'+pad2(v.getDate());
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){let y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+pad2(m[2])+'-'+pad2(m[1]);}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+'-'+pad2(m[2])+'-'+pad2(m[3]);
  return null;
}
function fmtFecha(iso){if(!iso)return '—';const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y;}
function closeModal(){document.getElementById('modal').innerHTML='';}

// ============================================================
// ESTADO GLOBAL
// ============================================================
let CU=null;
let DB={vendedores:[],liquidaciones:[]};

async function loadVendedores(){

// ============================================================
// LOGIN

// ============================================================
// PARSEO DEL EXCEL
// ============================================================
const SHEET_KEYWORDS={
  resumen:['resumen'],
  detalle:['detalle'],
  sinComision:['revisar','sin comision'],
  excluidos:['exclu']
};
function findSheetName(wb,keywords){
  const names=wb.SheetNames;
  for(const kw of keywords){
    const hit=names.find(n=>normKey(n).includes(normKey(kw)));
    if(hit)return hit;
  }
  return null;
}
// Columnas por posición (0-based). Formato viejo (4 hojas: Detalle - Comisión Calculada /
// Sin Comisión - Revisar / Excluidos) — se mantiene por si alguna vez vuelve a aparecer.
const COLS_DETALLE_V1=['vendedor','empresa','fecha','cliente','nro_pago','tipo_doc','nro_documento','importe_pago','neto_documento','total_documento','base_comisionable','pct_comision','comision_a_pagar'];
const COLS_SIN_COMISION=['vendedor','empresa','fecha','cliente','nro_pago','motivo','importe','aplica'];
const COLS_EXCLUIDOS=['cliente','motivo','empresa','fecha','nro_pago','importe'];
// Formato nuevo (7-sep-2026 en adelante): una sola hoja "Detalle" ya pulida a mano por Diego,
// sin hojas separadas de Sin Comisión/Excluidos. "Comision" en blanco = todavía sin definir
// (va a la sección "a revisar"); "Comision" = 0 es un valor real (ej. cheque rechazado, "CHR").
const COLS_DETALLE_V2=['vendedor','empresa','fecha','cliente','nro_pago','importe','documento','tasa','donde_se_liquida','tipo_ab','comision'];

function sheetRows(ws){
  // header:1 -> array de arrays; nos independiza de cómo estén tipeados los encabezados reales.
  return XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
}
function findHeaderRowIdx(rawRows,firstColKeyword){
  // Busca la fila cuya primera celda matchea el encabezado esperado (ej: "Vendedor", "Cliente").
  // Necesario porque algunas hojas traen una fila de título arriba del encabezado real y otras no.
  const nk=normKey(firstColKeyword);
  for(let i=0;i<rawRows.length;i++){
    if(normKey(rawRows[i]&&rawRows[i][0])===nk)return i;
  }
  return -1; // no se encontró: el caller cae a asumir que la fila 0 es el encabezado
}
function mapRows(rawRows,cols,headerKeyword){
  const headerIdx=findHeaderRowIdx(rawRows,headerKeyword);
  const startIdx=headerIdx>=0?headerIdx+1:1;
  const out=[];
  for(let i=startIdx;i<rawRows.length;i++){
    const row=rawRows[i];
    if(!row||row.every(c=>c===''||c==null))continue;
    const obj={};
    cols.forEach((key,idx)=>{obj[key]=row[idx]!==undefined?row[idx]:'';});
    out.push(obj);
  }
  return out;
}
// Alias (ya normalizados con normKey) de los encabezados de la hoja "Sin Comisión - Revisar".
// Esta hoja cambió de diseño entre la salida cruda de la tarea (7-8 columnas) y la versión pulida
// a mano (13 columnas, con Tipo Doc./N° Documento/% Comisión/A-B/Base/Comisión), así que se lee
// por nombre de columna en vez de por posición.
const ALIAS_SIN_COMISION={
  vendedor:['vendedor'],empresa:['empresa'],fecha:['fecha'],cliente:['cliente'],
  nro_pago:['n de pago'],categoria:['tipo doc'],nro_documento:['n documento'],
  importe:['importe'],pct:['comision'],motivo:['motivo'],tipo_ab:['a b','aplica'],
  base:['base comisionable'],comision:['comision a pagar']
};
// Alias de la hoja "Detalle - Comisión Calculada" (formato de 4 hojas).
const ALIAS_DETALLE_V1={
  vendedor:['vendedor'],empresa:['empresa'],fecha:['fecha'],cliente:['cliente'],nro_pago:['n de pago'],
  tipo_doc:['tipo doc'],nro_documento:['n documento'],importe_pago:['importe del pago','importe'],
  neto_documento:['neto documento'],total_documento:['total documento'],
  base_comisionable:['base comisionable'],pct_comision:['comision'],comision_a_pagar:['comision a pagar']
};
function mapRowsByHeader(rawRows,headerKeyword,aliases,fallbackCols,requeridos=['vendedor','importe']){
  const headerIdx=findHeaderRowIdx(rawRows,headerKeyword);
  if(headerIdx<0)return mapRows(rawRows,fallbackCols,headerKeyword);
  const headers=(rawRows[headerIdx]||[]).map(h=>normKey(h));
  const colIdx={};
  for(const [campo,nombres] of Object.entries(aliases)){
    const i=headers.findIndex(h=>nombres.includes(h));
    if(i>=0)colIdx[campo]=i;
  }
  // si falta algún campo clave no reconocemos el encabezado: se cae al mapeo posicional de siempre
  if(requeridos.some(c=>colIdx[c]===undefined))return mapRows(rawRows,fallbackCols,headerKeyword);
  const out=[];
  for(let i=headerIdx+1;i<rawRows.length;i++){
    const row=rawRows[i];
    if(!row||row.every(c=>c===''||c==null))continue;
    const obj={};
    for(const campo of Object.keys(aliases)){
      const v=colIdx[campo]!==undefined?row[colIdx[campo]]:undefined;
      obj[campo]=v!==undefined?v:'';
    }
    out.push(obj);
  }
  return out;
}
function normalizePct(v){
  // El Excel real guarda "% Comisión" como fracción (0.05 = 5%), no como "5". Cualquier
  // valor <=1 se interpreta como fracción y se pasa a porcentaje entero (para que coincida
  // con la escala de vendedores.pct_comision, que guarda 5, 7.5, 10, 30...).
  const n=parseNum(v);
  return (n>0&&n<=1)?n*100:n;
}

let PARSED=null; // { detalle:[], sinComision:[], excluidos:[], sheetsFound:{...} }

function resolveVendorName(nombreCrudo,tasaCruda){
  // "Ruben" sin aclarar tasa (formato nuevo): matchea contra "Ruben (7,5%)"/"Ruben (10%)" según
  // la columna Tasa de esa fila puntual — cada vendedor conserva su cuenta corriente separada.
  const nombre=String(nombreCrudo||'').trim();
  if(normKey(nombre)!=='ruben')return nombre;
  const tasaPct=normalizePct(tasaCruda);
  const candidatos=DB.vendedores.filter(v=>normKey(v.nombre_mostrar).startsWith('ruben'));
  const match=candidatos.find(v=>Math.abs(v.pct_comision-tasaPct)<0.01);
  return match?match.nombre_mostrar:nombre;
}

function parseWorkbook(wb){
  const detSheet=findSheetName(wb,SHEET_KEYWORDS.detalle);
  const scSheet=findSheetName(wb,SHEET_KEYWORDS.sinComision);
  const excSheet=findSheetName(wb,SHEET_KEYWORDS.excluidos);
  if(!detSheet)throw new Error('No encontré la hoja "Detalle" en el Excel. Hojas disponibles: '+wb.SheetNames.join(', '));

  // Si aparece una hoja separada de Sin Comisión o Excluidos, es el formato viejo (4 hojas).
  // Si no, es el formato nuevo (una sola hoja "Detalle" ya pulida a mano).
  const res=(scSheet||excSheet)?parseWorkbookV1(wb,detSheet,scSheet,excSheet):parseWorkbookV2(wb,detSheet);
  res.medios=parseMediosPago(wb);
  return descartarVendedoresInactivos(res);
}

// Hoja opcional "Medios de Pago": una fila por cheque/echeq (o una sola fila si el recibo se pagó en
// efectivo / transferencia). Se agrupa por (empresa, N° de pago) y se guarda en recibos_pago.
const ALIAS_MEDIOS={
  empresa:['empresa'],nro_pago:['n de pago'],fecha:['fecha'],cliente:['cliente'],
  importe:['importe del pago','importe'],medio:['medio de pago','medio'],diario:['diario'],
  referencia:['referencia','memo'],cheque_nro:['n cheque','n de cheque','cheque'],banco:['banco'],
  fecha_cobro:['fecha de cobro'],importe_cheque:['importe cheque','importe del cheque']
};
function parseMediosPago(wb){
  const nombre=findSheetName(wb,['medios de pago','medios']);
  if(!nombre)return [];
  const raw=sheetRows(wb.Sheets[nombre]);
  if(findHeaderRowIdx(raw,'Empresa')<0)return [];
  const filas=mapRowsByHeader(raw,'Empresa',ALIAS_MEDIOS,[],['nro_pago','medio']);
  const porRecibo={};
  filas.forEach(r=>{
    const nro=String(r.nro_pago||'').trim();
    if(!nro||normKey(nro)==='total')return;
    const empresa=String(r.empresa||'').trim();
    const k=normKey(empresa)+'|'+nro;
    const rec=porRecibo[k]||(porRecibo[k]={empresa,nro_pago:nro,fecha:parseFechaCell(r.fecha),cliente:String(r.cliente||'').trim()||null,
      importe:parseNum(r.importe),medio:String(r.medio||'').trim(),diario:String(r.diario||'').trim()||null,
      referencia:String(r.referencia||'').trim()||null,cheques:[],fuente:'excel'});
    const numCh=String(r.cheque_nro||'').trim();
    if(numCh)rec.cheques.push({numero:numCh,banco:String(r.banco||'').trim(),fecha_cobro:parseFechaCell(r.fecha_cobro),importe:parseNum(r.importe_cheque)});
  });
  return Object.values(porRecibo);
}
// PostgREST upsert (sbFetch no permite pasar headers propios sin perder la apikey).
async function sbUpsert(path,rows){
  const res=await fetch(SUPABASE_URL+'/rest/v1/'+path,{method:'POST',
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify(rows)});
  if(!res.ok)throw new Error(await res.text());
}

// Los vendedores marcados activo=false en la tabla `vendedores` (ej. Laura Aguado, que se liquida
// aparte) no se liquidan en esta app: sus filas se descartan al importar y el preview avisa
// cuántas fueron, para que no queden como "a revisar" ni sumen comisiones sin querer.
function descartarVendedoresInactivos(res){
  const ignorados={};
  const filtrar=filas=>filas.filter(r=>{
    const v=findVendedor(r.vendedor_nombre);
    if(v&&!v.activo){ignorados[v.nombre_mostrar]=(ignorados[v.nombre_mostrar]||0)+1;return false;}
    return true;
  });
  res.detalle=filtrar(res.detalle);
  res.sinComision=filtrar(res.sinComision);
  res.ignorados=ignorados;
  return res;
}

function parseWorkbookV1(wb,detSheet,scSheet,excSheet){
  const detalleRaw=mapRowsByHeader(sheetRows(wb.Sheets[detSheet]),'Vendedor',ALIAS_DETALLE_V1,COLS_DETALLE_V1,['vendedor','importe_pago','comision_a_pagar']);
  const sinComisionRaw=scSheet?mapRowsByHeader(sheetRows(wb.Sheets[scSheet]),'Vendedor',ALIAS_SIN_COMISION,COLS_SIN_COMISION):[];
  const excluidosRaw=excSheet?mapRows(sheetRows(wb.Sheets[excSheet]),COLS_EXCLUIDOS,'Cliente'):[];

  const detalle=detalleRaw.map(r=>({
    vendedor_nombre:resolveVendorName(r.vendedor,r.pct_comision),
    empresa:String(r.empresa||'').trim(),
    fecha_pago:parseFechaCell(r.fecha),
    cliente:String(r.cliente||'').trim(),
    nro_pago:String(r.nro_pago||'').trim(),
    tipo_doc:String(r.tipo_doc||'').trim(),
    nro_documento:String(r.nro_documento||'').trim(),
    importe_pago:parseNum(r.importe_pago),
    neto_documento:parseNum(r.neto_documento),
    total_documento:parseNum(r.total_documento),
    base_comisionable:parseNum(r.base_comisionable),
    pct_comision:normalizePct(r.pct_comision),
    comision_a_pagar:parseNum(r.comision_a_pagar)
  })).filter(r=>(r.vendedor_nombre||r.cliente)&&normKey(r.vendedor_nombre)!=='total');

  // "Sin Comisión - Revisar": en la versión pulida a mano, las filas que ya traen A/B + Comisión
  // a Pagar son comisiones resueltas (pasan a Detalle, igual que en el formato nuevo); las que
  // quedan en blanco siguen "a revisar". En la salida cruda vieja (sin esas columnas) todas
  // quedan "a revisar", como siempre.
  const sinComision=[];
  sinComisionRaw.forEach(r=>{
    const vendedor_nombre=resolveVendorName(r.vendedor,r.pct);
    if(!vendedor_nombre&&!String(r.cliente||'').trim())return;
    if(normKey(vendedor_nombre)==='total')return;
    const empresa=String(r.empresa||'').trim();
    const fecha_pago=parseFechaCell(r.fecha);
    const cliente=String(r.cliente||'').trim();
    const nro_pago=String(r.nro_pago||'').trim();
    const categoria=String(r.categoria||'').trim();
    let doc=String(r.nro_documento||'').trim();
    if(doc==='-')doc='';
    // La salida cruda no trae N° Documento: se usa la primera parte del motivo (ej. "Saldo
    // migración", "Anticipo sin aplicar") en vez del texto explicativo completo.
    const motivoOrig=String(r.motivo||'').trim();
    const motivoCorto=motivoOrig.split(/\s+-\s+|:\s/)[0].trim();
    const documento=[categoria,doc].filter(Boolean).join(' — ')||motivoCorto;
    const tipoAB=String(r.tipo_ab||'').trim();
    const pct=normalizePct(r.pct);
    const importe=parseNum(r.importe);
    const resuelta=r.comision!==''&&r.comision!=null&&tipoAB!=='';
    if(resuelta){
      const comision=parseNum(r.comision);
      const base=(r.base!==''&&r.base!=null)?parseNum(r.base):(pct>0?comision/(pct/100):0);
      detalle.push({vendedor_nombre,empresa,fecha_pago,cliente,nro_pago,tipo_doc:tipoAB,nro_documento:documento,
        importe_pago:importe,neto_documento:null,total_documento:null,base_comisionable:base,pct_comision:pct,comision_a_pagar:comision});
    }else{
      sinComision.push({vendedor_nombre,empresa,fecha_pago,cliente,nro_pago,
        motivo:'Comisión sin definir todavía'+(documento?' — '+documento:''),
        importe,aplica:tipoAB});
    }
  });

  const excluidos=excluidosRaw.map(r=>({
    cliente:String(r.cliente||'').trim(),
    motivo:String(r.motivo||'').trim(),
    empresa:String(r.empresa||'').trim(),
    fecha_pago:parseFechaCell(r.fecha),
    nro_pago:String(r.nro_pago||'').trim(),
    importe:parseNum(r.importe)
  })).filter(r=>(r.cliente||r.motivo)&&normKey(r.cliente)!=='total');

  return {detalle,sinComision,excluidos,sheetsFound:{detSheet,scSheet,excSheet,formatVersion:'v1'}};
}

function parseWorkbookV2(wb,detSheet){
  const rows=mapRows(sheetRows(wb.Sheets[detSheet]),COLS_DETALLE_V2,'Vendedor')
    .filter(r=>String(r.vendedor||'').trim()||String(r.cliente||'').trim());

  const detalle=[],sinComision=[];
  rows.forEach(r=>{
    const vendedor_nombre=resolveVendorName(r.vendedor,r.tasa);
    const empresa=String(r.empresa||'').trim();
    const fecha_pago=parseFechaCell(r.fecha);
    const cliente=String(r.cliente||'').trim();
    const nro_pago=String(r.nro_pago||'').trim();
    const documento=String(r.documento||'').trim();
    const tipoAB=String(r.tipo_ab||'').trim();
    const pct_comision=normalizePct(r.tasa);
    const importe_pago=parseNum(r.importe);
    const sinDefinir=r.comision===''||r.comision==null;
    if(sinDefinir){
      sinComision.push({vendedor_nombre,empresa,fecha_pago,cliente,nro_pago,motivo:'Comisión sin definir todavía'+(documento?' — '+documento:''),importe:importe_pago,aplica:tipoAB});
    }else{
      const comision_a_pagar=parseNum(r.comision);
      detalle.push({
        vendedor_nombre,empresa,fecha_pago,cliente,nro_pago,
        tipo_doc:tipoAB,
        nro_documento:documento,
        importe_pago,
        neto_documento:null,
        total_documento:null,
        base_comisionable:pct_comision>0?comision_a_pagar/(pct_comision/100):0,
        pct_comision,
        comision_a_pagar
      });
    }
  });

  return {detalle,sinComision,excluidos:[],sheetsFound:{detSheet,scSheet:null,excSheet:null,formatVersion:'v2'}};
}

function inferPeriodo(parsed){
  const fechas=[...parsed.detalle,...parsed.sinComision,...parsed.excluidos].map(r=>r.fecha_pago).filter(Boolean);
  if(!fechas.length)return null;
  const counts={};
  fechas.forEach(f=>{const k=f.slice(0,7);counts[k]=(counts[k]||0)+1;});
  const best=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
  const [y,m]=best.split('-');
  return {anio:parseInt(y,10),mes:parseInt(m,10)};
}

async function onCargaFile(ev){
  const file=ev.target.files[0];
  if(!file)return;
  document.getElementById('carga-file-label').textContent='📄 '+file.name;
  const prevEl=document.getElementById('carga-preview');
  prevEl.innerHTML='<div class="loading">Leyendo archivo...</div>';
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    PARSED=parseWorkbook(wb);
    PARSED.archivoNombre=file.name;
    const periodo=inferPeriodo(PARSED);
    if(periodo){document.getElementById('carga-mes').value=periodo.mes;document.getElementById('carga-anio').value=periodo.anio;}
    renderCargaPreview();
  }catch(e){
    prevEl.innerHTML='<div class="alert alert-red">Error al leer el archivo: '+esc(e.message)+'</div>';

  }

function renderCargaPreview(){
  const prevEl=document.getElementById('carga-preview');
  if(!PARSED){prevEl.innerHTML='';return;}
  const {detalle,sinComision,excluidos,sheetsFound}=PARSED;

  // Resumen por vendedor calculado a partir del detalle parseado
  const porVendedor={};
  detalle.forEach(r=>{
    const key=r.vendedor_nombre||'(sin nombre)';
    if(!porVendedor[key])porVendedor[key]={cant:0,base:0,comision:0,conocido:!!findVendedor(key)};
    porVendedor[key].cant++;porVendedor[key].base+=r.base_comisionable;porVendedor[key].comision+=r.comision_a_pagar;
  });
  const desconocidos=Object.keys(porVendedor).filter(k=>!porVendedor[k].conocido);
  const totalComision=detalle.reduce((a,r)=>a+r.comision_a_pagar,0);
  const totalBase=detalle.reduce((a,r)=>a+r.base_comisionable,0);

  let warns='';
  if(sheetsFound.formatVersion==='v1'){
    if(!sheetsFound.scSheet)warns+='<div class="alert alert-amber">No encontré la hoja "Sin Comisión - Revisar" — se guardará vacía.</div>';
    if(!sheetsFound.excSheet)warns+='<div class="alert alert-amber">No encontré la hoja "Excluidos" — se guardará vacía.</div>';
  }
  const ignorados=PARSED.ignorados||{};
  if(Object.keys(ignorados).length)warns+='<div class="alert alert-gray" style="background:#f5f5f5;color:#555;border:1px solid #e0e0e0">Se ignoraron filas de vendedores que no se liquidan acá (inactivos): <b>'+Object.entries(ignorados).map(([n,c])=>esc(n)+' ('+c+')').join(', ')+'</b>.</div>';
  const conImporteCero=detalle.filter(r=>r.importe_pago===0).length+sinComision.filter(r=>r.importe===0).length;
  if(conImporteCero)warns+='<div class="alert alert-amber">Hay <b>'+conImporteCero+'</b> pago(s) con importe $0 — puede que las columnas del Excel no coincidan con lo esperado. Revisá el preview antes de confirmar.</div>';
  if(desconocidos.length)warns+='<div class="alert alert-red">Vendedor(es) en el Excel que no están en la tabla de vendedores: <b>'+desconocidos.map(esc).join(', ')+'</b>. Revisá el nombre exacto o agregalo en la tabla <code>vendedores</code> antes de confirmar (si confirmás igual, sus comisiones se guardan pero no van a sumar en la cuenta corriente hasta que coincida el nombre).</div>';

  prevEl.innerHTML=`
    <p class="small">Formato detectado: ${sheetsFound.formatVersion==='v2'?'nuevo (una hoja "Detalle" pulida a mano)':'viejo (4 hojas)'}</p>
    <p class="small" style="margin-top:4px">${(PARSED.medios||[]).length?'💳 Medios de pago: <b>'+PARSED.medios.length+' recibos</b> ('+PARSED.medios.reduce((a,m)=>a+m.cheques.length,0)+' cheques/echeqs) — se podrá ver cómo pagó el cliente al tocar cada recibo.':'Sin hoja "Medios de Pago": los recibos de este mes no van a mostrar cómo pagó el cliente.'}</p>
    ${warns}
    <div class="grid4" style="margin:16px 0">
      <div class="metric"><div class="metric-label">Pagos comisionados</div><div class="metric-value">${detalle.length}</div></div>
      <div class="metric"><div class="metric-label">Base comisionable</div><div class="metric-value">${fmt(totalBase)}</div></div>
      <div class="metric"><div class="metric-label">Comisión total</div><div class="metric-value">${fmt(totalComision)}</div></div>
      <div class="metric"><div class="metric-label">A revisar / excluidos</div><div class="metric-value">${sinComision.length} / ${excluidos.length}</div></div>
    </div>
    <div class="table-wrap" style="margin-bottom:16px">
      <table><thead><tr><th>Vendedor</th><th>Cant. Pagos</th><th>Base Comisionable</th><th>Comisión</th></tr></thead>
      <tbody>${Object.entries(porVendedor).map(([k,v])=>'<tr><td>'+esc(k)+(v.conocido?'':' <span class="badge badge-red">no reconocido</span>')+'</td><td>'+v.cant+'</td><td>'+fmt(v.base)+'</td><td>'+fmt(v.comision)+'</td></tr>').join('')}</tbody></table>

    <div style="text-align:right;display:flex;gap:8px;justify-content:flex-end">
      <button onclick="cancelarCarga()">Cancelar</button>
      <button class="primary" onclick="confirmarCarga()">Confirmar y guardar</button>
    </div>
  `;
}

async function confirmarCarga(){
  if(!PARSED)return;
  const mes=parseInt(document.getElementById('carga-mes').value,10);
  const anio=parseInt(document.getElementById('carga-anio').value,10);
  const prevEl=document.getElementById('carga-preview');
  prevEl.innerHTML='<div class="loading">Guardando...</div>';
  try{
    const existentes=await sbFetch('liquidaciones?mes=eq.'+mes+'&anio=eq.'+anio+'&select=*');
    let liq;
    if(existentes.length){
      liq=existentes[0];
      const [gruposExistentes,recibosAprobados]=await Promise.all([
        sbFetch('liquidacion_vendedores?liquidacion_id=eq.'+liq.id+'&select=estado'),
        sbFetch('liquidacion_detalle?liquidacion_id=eq.'+liq.id+'&aprobado=eq.true&select=id'),
      ]);
      const yaDecididos=gruposExistentes.filter(g=>g.estado!=='pendiente');
      if(yaDecididos.length||recibosAprobados.length){
        prevEl.innerHTML='<div class="alert alert-red">Ya existe una liquidación de '+MESES[mes-1]+' '+anio+' con aprobaciones hechas ('+recibosAprobados.length+' recibo(s) aprobado(s), '+yaDecididos.length+' vendedor(es) ya decididos). No se puede sobreescribir desde acá — si hace falta corregir, avisá para hacerlo a mano.</div>';
        return;
      }
      if(!confirm('Ya existe una carga pendiente para '+MESES[mes-1]+' '+anio+'. ¿Reemplazarla con este archivo?')){renderCargaPreview();return;}
      await sbFetch('liquidacion_detalle?liquidacion_id=eq.'+liq.id,{method:'DELETE'});
      await sbFetch('liquidacion_sin_comision?liquidacion_id=eq.'+liq.id,{method:'DELETE'});
      await sbFetch('liquidacion_excluidos?liquidacion_id=eq.'+liq.id,{method:'DELETE'});
      await sbFetch('liquidacion_vendedores?liquidacion_id=eq.'+liq.id,{method:'DELETE'});
      await sbFetch('liquidaciones?id=eq.'+liq.id,{method:'PATCH',body:JSON.stringify({archivo_nombre:PARSED.archivoNombre,cargado_por:CU.label,created_at:new Date().toISOString()})});
    }else{
      const rows=await sbFetch('liquidaciones',{method:'POST',body:JSON.stringify({mes,anio,archivo_nombre:PARSED.archivoNombre,cargado_por:CU.label})});
      liq=rows[0];
    }
    const chunk=(arr,n)=>{const out=[];for(let i=0;i<arr.length;i+=n)out.push(arr.slice(i,i+n));return out;};
    for(const part of chunk(PARSED.detalle.map(r=>({...r,liquidacion_id:liq.id})),500)){
      if(part.length)await sbFetch('liquidacion_detalle',{method:'POST',body:JSON.stringify(part)});
    }
    for(const part of chunk(PARSED.sinComision.map(r=>({...r,liquidacion_id:liq.id})),500)){
      if(part.length)await sbFetch('liquidacion_sin_comision',{method:'POST',body:JSON.stringify(part)});
    }
    for(const part of chunk(PARSED.excluidos.map(r=>({...r,liquidacion_id:liq.id})),500)){
      if(part.length)await sbFetch('liquidacion_excluidos',{method:'POST',body:JSON.stringify(part)});
    }
    // Un grupo por vendedor (unión de Detalle + Sin Comisión) para poder aprobar/rechazar por separado.
    const vendedoresDelMes=new Set([...PARSED.detalle.map(r=>r.vendedor_nombre),...PARSED.sinComision.map(r=>r.vendedor_nombre)].filter(Boolean));
    const gruposVendedor=[...vendedoresDelMes].map(vendedor_nombre=>({liquidacion_id:liq.id,vendedor_nombre}));
    for(const part of chunk(gruposVendedor,500)){
      if(part.length)await sbFetch('liquidacion_vendedores',{method:'POST',body:JSON.stringify(part)});
    }
    // medios de pago de los recibos (hoja opcional): se guardan/actualizan por (empresa, N° de pago)
    for(const part of chunk(PARSED.medios||[],200)){
      if(part.length)await sbUpsert('recibos_pago?on_conflict=empresa,nro_pago',part);
    }
    PARSED=null;
    sTab('historial');
    setTimeout(()=>verLiquidacion(liq.id),50);
  }catch(e){
    prevEl.innerHTML='<div class="alert alert-red">Error al guardar: '+esc(e.message)+'</div>';
  }
}

let HIST_MESES=[],HIST_SEL=0,CH_BARRAS=null,CH_DONA=null;
const COLOR_ESTADO={pendiente:'#ffb74d',aprobada:'#66bb6a',pagada:'#ba68c8',rechazada:'#ef5350'};
const TEXTO_ESTADO={pendiente:'#f57f17',aprobada:'#2a7a0a',pagada:'#6a1b9a',rechazada:'#c62828',parcial:'#1565c0'};
const NOMBRE_ESTADO={pendiente:'Pendiente',aprobada:'Aprobada',pagada:'Pagada',rechazada:'Rechazada',parcial:'Parcial'};
const PALETA_DONA=['#1976d2','#e64a19','#388e3c','#7b1fa2','#fbc02d','#0097a7','#c2185b','#5d4037','#455a64','#afb42b','#00796b','#d84315'];

// Un elemento por liquidación (orden cronológico) con su comisión total, partida por estado del
// grupo del vendedor (pendiente / aprobada / pagada / rechazada) y por vendedor.
function calcHistorialMeses(liqs,grupos,detalle){
  const grupoDe={};
  grupos.forEach(g=>{grupoDe[g.liquidacion_id+'|'+g.vendedor_nombre]=g;});
  // estado de cada recibo: rechazado (vendedor rechazado) > tildado (aprobada / pagada) > pendiente
  const estadoRecibo=r=>{
    const g=grupoDe[r.liquidacion_id+'|'+r.vendedor_nombre];
    if(g&&g.estado==='rechazada')return 'rechazada';
    if(r.aprobado)return (g&&g.pagado)?'pagada':'aprobada';
    return 'pendiente';
  };
  const meses=liqs.slice().sort((a,b)=>a.anio-b.anio||a.mes-b.mes).map(l=>({
    id:l.id,etiqueta:MESES[l.mes-1].slice(0,3)+' '+String(l.anio).slice(2),titulo:MESES[l.mes-1]+' '+l.anio,
    porEstado:{pendiente:0,aprobada:0,pagada:0,rechazada:0},porVendedor:{},total:0
  }));
  const porId={};meses.forEach(m=>{porId[m.id]=m;});
  detalle.forEach(r=>{
    const m=porId[r.liquidacion_id];if(!m)return;
    const est=estadoRecibo(r);
    const c=r.comision_a_pagar||0;
    m.porEstado[est]+=c;m.total+=c;
    const pv=m.porVendedor[r.vendedor_nombre]||(m.porVendedor[r.vendedor_nombre]={monto:0,estado:est});
    pv.monto+=c;
    if(pv.estado!==est)pv.estado='parcial'; // el vendedor tiene recibos en estados distintos
  });
  return meses;
}
function calcKpisHistorial(meses,pagos){
  const pendiente=meses.reduce((a,m)=>a+m.porEstado.pendiente,0);
  const aprobado=meses.reduce((a,m)=>a+m.porEstado.aprobada+m.porEstado.pagada,0);
  const pagado=pagos.reduce((a,p)=>a+(p.importe||0),0);
  return {pendiente,aprobado,pagado,aPagar:aprobado-pagado};
}
function fmtCorto(v){
  if(Math.abs(v)>=1e6)return '$ '+(v/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})+' M';
  if(Math.abs(v)>=1e3)return '$ '+Math.round(v/1e3).toLocaleString('es-AR')+' k';
  return '$ '+Math.round(v);
}
function dibujarGraficosHistorial(){
  if(typeof Chart==='undefined'){
    document.getElementById('chart-barras').parentElement.innerHTML='<p class="small">No se pudo cargar la librería de gráficos (revisá la conexión).</p>';
    return;
  }
  if(CH_BARRAS)CH_BARRAS.destroy();
  if(CH_DONA)CH_DONA.destroy();

  CH_BARRAS=new Chart(document.getElementById('chart-barras'),{
    type:'bar',
    data:{

      datasets:estados.map(e=>({

        borderColor:ctx=>ctx.dataIndex===HIST_SEL?'#1a1a1a':'transparent',borderWidth:ctx=>ctx.dataIndex===HIST_SEL?1.5:0,
        borderSkipped:false,maxBarThickness:56
      }))
    },

      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      scales:{
        x:{stacked:true,grid:{display:false}},

      },
      plugins:{
        legend:{position:'bottom',labels:{boxWidth:12,filter:(item,data)=>data.datasets[item.datasetIndex].data.some(v=>v>0)}},
        tooltip:{callbacks:{
          title:items=>HIST_MESES[items[0].dataIndex].titulo,
          label:c=>c.parsed.y>0?' '+c.dataset.label+': '+fmt(c.parsed.y):null,
          footer:items=>'Total: '+fmt(HIST_MESES[items[0].dataIndex].total)
        }}
      },
      onClick:(evt,els)=>{if(els.length)seleccionarMesHistorial(els[0].index);},
      onHover:(evt,els)=>{evt.native.target.style.cursor=els.length?'pointer':'default';}
    }
  });
  CH_DONA=new Chart(document.getElementById('chart-dona'),{
    type:'doughnut',
    data:{labels:[],datasets:[{data:[],backgroundColor:[],borderWidth:1}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{display:false},
      tooltip:{callbacks:{label:c=>' '+c.label+': '+fmt(c.parsed)}}}}
  });
  actualizarDonaHistorial(HIST_SEL);
}
function seleccionarMesHistorial(i){
  HIST_SEL=i;
  CH_BARRAS.update();
  actualizarDonaHistorial(i);
}
function actualizarDonaHistorial(i){
  const m=HIST_MESES[i];
  document.getElementById('dona-titulo').textContent='REPARTO POR VENDEDOR — '+m.titulo.toUpperCase();
  document.getElementById('dona-sub').textContent='Total del mes: '+fmt(m.total);
  const lista=document.getElementById('dona-lista');
  const vend=Object.entries(m.porVendedor).map(([n,v])=>({nombre:n,monto:v.monto,estado:v.estado})).filter(v=>v.monto>0).sort((a,b)=>b.monto-a.monto);
  if(!vend.length||m.total<=0){
    CH_DONA.data.labels=[];CH_DONA.data.datasets[0].data=[];CH_DONA.data.datasets[0].backgroundColor=[];CH_DONA.update();
    lista.innerHTML='<p class="small">Este mes todavía no tiene comisiones calculadas.</p>';
    return;
  }
  // los que pesan menos del 3% se agrupan como "Otros" en la dona (la lista los muestra a todos)
  const chicos=vend.filter(v=>v.monto/m.total<0.03);
  const agrupar=chicos.length>=2;
  const grandes=agrupar?vend.filter(v=>v.monto/m.total>=0.03):vend;
  const colorDe={};vend.forEach((v,k)=>{colorDe[v.nombre]=PALETA_DONA[k%PALETA_DONA.length];});
  const labels=grandes.map(v=>v.nombre),data=grandes.map(v=>v.monto),colores=grandes.map(v=>colorDe[v.nombre]);
  if(agrupar){labels.push('Otros');data.push(chicos.reduce((a,v)=>a+v.monto,0));colores.push('#b0bec5');}
  CH_DONA.data.labels=labels;CH_DONA.data.datasets[0].data=data;CH_DONA.data.datasets[0].backgroundColor=colores;CH_DONA.update();
  lista.innerHTML=vend.map(v=>{
    const enOtros=agrupar&&chicos.includes(v);
    return '<div class="dona-item"><span class="dona-dot" style="background:'+(enOtros?'#b0bec5':colorDe[v.nombre])+'"></span>'
      +'<span style="flex:1">'+esc(v.nombre)+'</span>'
      +'<span class="small" style="color:'+TEXTO_ESTADO[v.estado]+'">'+NOMBRE_ESTADO[v.estado]+'</span>'
      +'<span style="min-width:96px;text-align:right">'+fmt(v.monto)+'</span>'
      +'<span class="small" style="min-width:42px;text-align:right">'+(v.monto/m.total*100).toLocaleString('es-AR',{maximumFractionDigits:1})+'%</span></div>';
  }).join('');
}
function badgeEstado(e,detalle){
  if(e==='pagada')return '<span class="badge badge-purple">Pagada</span>';
  if(e==='aprobada')return '<span class="badge badge-green">Aprobada</span>';
  if(e==='parcial')return '<span class="badge" style="background:#e3f2fd;color:#1565c0">Parcial'+(detalle?' '+detalle:'')+'</span>';
  if(e==='rechazada')return '<span class="badge badge-red">Rechazada</span>';
  return '<span class="badge badge-amber">Pendiente</span>';
}
function badgeResumenGrupos(r){
  if(!r)return '<span class="badge badge-gray">Sin vendedores</span>';
  const parc=r.parcial||0;
  const total=r.pendiente+parc+r.aprobada+r.rechazada;
  if(r.aprobada===total)return '<span class="badge badge-green">Aprobada ('+total+'/'+total+')</span>';
  if(r.rechazada===total)return '<span class="badge badge-red">Rechazada ('+total+'/'+total+')</span>';
  if(r.pendiente===total)return '<span class="badge badge-amber">Pendiente</span>';
  const partes=[];
  if(r.aprobada)partes.push(r.aprobada+' aprob.');
  if(parc)partes.push(parc+' parc.');
  if(r.rechazada)partes.push(r.rechazada+' rech.');
  if(r.pendiente)partes.push(r.pendiente+' pend.');
  return '<span class="badge badge-amber">Parcial — '+partes.join(' / ')+'</span>';
}
// Aprobación recibo por recibo: cada fila de liquidacion_detalle tiene `aprobado` (tildado).
// El estado de un vendedor en una liquidación sale de cuántos de sus recibos están tildados; el
// estado guardado en liquidacion_vendedores solo manda para "rechazada" y para vendedores sin
// recibos comisionados.
function estadoVisualGrupo(g,nRecibos,nAprobados){
  if(g.estado==='rechazada')return 'rechazada';
  if(nRecibos>0){
    if(nAprobados===nRecibos)return g.pagado?'pagada':'aprobada';
    return nAprobados>0?'parcial':'pendiente';
  }
  return g.estado==='aprobada'?(g.pagado?'pagada':'aprobada'):'pendiente';
}
function contarRecibos(detalle){
  const m={};
  detalle.forEach(r=>{
    const k=r.liquidacion_id+'|'+r.vendedor_nombre;
    const o=m[k]||(m[k]={n:0,a:0});
    o.n++;if(r.aprobado)o.a++;
  });
  return m;
}
// Mantiene liquidacion_vendedores.estado/pagado alineado con los recibos tildados: 'aprobada' solo si
// TODOS los recibos del vendedor están tildados; si se destilda alguno vuelve a pendiente.
async function sincronizarEstadoGrupo(liquidacionId,vendedorNombre){
  const enc=encodeURIComponent(vendedorNombre);
  const [rows,grupos]=await Promise.all([
    sbFetch('liquidacion_detalle?liquidacion_id=eq.'+liquidacionId+'&vendedor_nombre=eq.'+enc+'&select=aprobado'),
    sbFetch('liquidacion_vendedores?liquidacion_id=eq.'+liquidacionId+'&vendedor_nombre=eq.'+enc+'&select=*'),
  ]);
  const g=grupos[0];
  if(!g||!rows.length)return;
  const todos=rows.every(r=>r.aprobado),alguno=rows.some(r=>r.aprobado);
  let patch=null;
  if(todos&&g.estado!=='aprobada')patch={estado:'aprobada',revisado_por:CU.label,revisado_at:new Date().toISOString(),motivo_rechazo:null};
  else if(!todos&&g.estado==='aprobada')patch={estado:'pendiente',pagado:false,pagado_por:null,pagado_at:null};
  else if(!todos&&g.estado==='rechazada'&&alguno)patch={estado:'pendiente',motivo_rechazo:null};
  if(patch)await sbFetch('liquidacion_vendedores?id=eq.'+g.id,{method:'PATCH',body:JSON.stringify(patch)});
}

// Comisión de un vendedor dentro de la liquidación: un único modal con TODO junto (ya
// comisionado + a revisar), reemplaza las tablas planas de "Detalle" y "Sin Comisión". El Tipo de
// cualquier fila (incluidas las ya resueltas) se puede cambiar ahí mismo — es reversible, elegir
// "— Elegir —" en una fila ya resuelta la vuelve a mandar a "sin comisión". Nada se guarda hasta
// tocar "Guardar cambios" (se activa solo cuando hay algo tocado).
//
// Divisor sobre el Importe según el tipo, mismo criterio que el pulido manual en Excel (validado
// contra datos reales de agosto 2026): A = Factura (21% IVA), B = NOF (sin IVA, importe completo),
// A/B = mixto (10,5%, la mitad de 21%). CHR (cheque rechazado) es comisión $0 fija, sin divisor.
const TIPO_DIVISOR={'A':1.21,'B':1,'A/B':1.105};
const TIPOS_VALIDOS=['A','B','A/B','CHR'];
function calcularComisionTipo(tipo,importe,pct){
  if(tipo==='CHR')return {base:0,comision:0};
  const div=TIPO_DIVISOR[tipo];
  if(!div)return null;
  const base=importe/div;
  return {base,comision:base*(pct/100)};
}
function calcTextoComision(tipo,importe,pct){
  if(!tipo)return '—';
  const r=calcularComisionTipo(tipo,importe,pct);
  return r?fmt(r.comision)+' (base '+fmt(r.base)+')':'—';
}

      sbFetch('liquidacion_sin_comision?liquidacion_id=eq.'+g.liquidacion_id+'&vendedor_nombre=eq.'+encodeURIComponent(g.vendedor_nombre)+'&select=*'),
    ]);
    const vendedor=findVendedor(g.vendedor_nombre);
    const pctVendedor=vendedor?vendedor.pct_comision:0;

    COMISION_CTX={};
    COMISION_GRUPO={liquidacionId:g.liquidacion_id,vendedor:g.vendedor_nombre,pagado:!!g.pagado};
    const filas=[];
    detRows.forEach(r=>{
      const key='d'+r.id;
      const tipo=TIPOS_VALIDOS.includes(r.tipo_doc)?r.tipo_doc:'';
      COMISION_CTX[key]={origin:'detalle',rowId:r.id,liquidacion_id:g.liquidacion_id,vendedor_nombre:g.vendedor_nombre,
        empresa:r.empresa,fecha_pago:r.fecha_pago,cliente:r.cliente,nro_pago:r.nro_pago,documento:r.nro_documento,
        importe:r.importe_pago,pct:r.pct_comision,original:tipo,current:tipo,
        aprobO:!!r.aprobado,aprobC:!!r.aprobado};
      filas.push(key);
    });
    revRows.forEach(r=>{
      const key='s'+r.id;
      const documento=String(r.motivo||'').replace(/^Comisión sin definir todavía( — )?/,'');
      COMISION_CTX[key]={origin:'sin_comision',rowId:r.id,liquidacion_id:g.liquidacion_id,vendedor_nombre:g.vendedor_nombre,
        empresa:r.empresa,fecha_pago:r.fecha_pago,cliente:r.cliente,nro_pago:r.nro_pago,documento,
        importe:r.importe,pct:pctVendedor,original:'',current:'',aprobO:false,aprobC:false};
      filas.push(key);
    });
    filas.sort((a,b)=>(COMISION_CTX[a].cliente||'').localeCompare(COMISION_CTX[b].cliente||''));
    const hayAprobables=detRows.length>0;

    const opcionesTipo=t=>['','A','B','A/B','CHR'].map(v=>'<option value="'+v+'"'+(v===t?' selected':'')+'>'+(v===''?'— Elegir —':v==='A'?'A · Factura':v==='B'?'B · NOF':v==='A/B'?'A/B · Mixto':'CHR · Rechazado')+'</option>').join('');

    document.getElementById('modal').innerHTML=`
      <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal" style="max-width:1050px">
          <div class="modal-title">${esc(g.vendedor_nombre)} — comisión de este mes</div>
          <p class="small" style="margin-bottom:6px"><b>Tildá los recibos que querés aprobar</b>: los tildados suman a la cuenta corriente del vendedor y los que no tildes quedan pendientes. Tocá el número de un recibo para ver cómo pagó el cliente.</p>
          <p class="small" style="margin-bottom:12px">También podés cambiar el Tipo de cualquier fila (es reversible: "— Elegir —" la vuelve a mandar a revisar). No se guarda nada hasta tocar "Guardar cambios".${g.pagado?' <b style="color:#6a1b9a">Este vendedor está marcado como Pagada: para destildar recibos primero revertí esa marca.</b>':''}</p>
          <div class="table-wrap" style="margin-bottom:16px;max-height:420px;overflow-y:auto"><table><thead><tr><th style="text-align:center">${hayAprobables?'<input type="checkbox" id="caprobar-todos" title="Tildar / destildar todos" style="width:auto" onchange="tildarTodosRecibos(this.checked)"><div style="font-size:10px">Aprobar</div>':''}</th><th>Empresa</th><th>Fecha</th><th>Cliente</th><th>Recibo</th><th>Doc. / Motivo</th><th>Importe</th><th>Tipo</th><th>Comisión</th></tr></thead>
          <tbody>${filas.length===0?'<tr><td colspan="9" class="small" style="white-space:normal">Sin filas.</td></tr>':filas.map(key=>{
            const c=COMISION_CTX[key];
            return `<tr id="crow-${key}" style="background:${colorFilaComision(c)}">
              <td style="text-align:center">${c.origin==='detalle'?`<input type="checkbox" id="caprob-${key}" style="width:auto" ${c.aprobC?'checked':''} onchange="onCambioAprobacion('${key}')">`:'<span class="small" title="Sin comisión definida: no se puede aprobar todavía">—</span>'}</td>
              <td>${esc(c.empresa)}</td><td>${fmtFecha(c.fecha_pago)}</td><td>${esc(c.cliente)}</td><td>${reciboLink(c.empresa,c.nro_pago)}</td><td>${esc(c.documento)}</td><td>${fmt(c.importe)}</td>
              <td><select id="ctipo-${key}" style="width:auto" onchange="onCambioTipoComision('${key}')">${opcionesTipo(c.original)}</select></td>
              <td id="ccalc-${key}" class="small">${calcTextoComision(c.original,c.importe,c.pct)}</td>
            </tr>`;
          }).join('')}</tbody></table></div>
          <div style="text-align:right;display:flex;gap:8px;justify-content:flex-end">
            <button onclick="closeModal()">Cerrar</button>
            <button class="success" id="cguardar-btn" disabled onclick="guardarCambiosComision(${g.liquidacion_id})">Guardar cambios</button>
          </div>
        </div>
      </div>`;
  }catch(e){alert('Error: '+e.message);}
}
let COMISION_GRUPO=null;
const filaTocada=c=>c.current!==c.original||c.aprobC!==c.aprobO;
// verde claro = recibo aprobado; rojo claro = sin comisión definida; ámbar = cambio sin guardar
function colorFilaComision(c){
  if(filaTocada(c))return '#fff8e1';
  if(!c.original)return '#fff5f5';
  return c.aprobC?'#f1f8f1':'';
}
function refrescarFilaComision(key){
  const c=COMISION_CTX[key];
  const row=document.getElementById('crow-'+key);
  if(row)row.style.background=colorFilaComision(c);
  const n=Object.values(COMISION_CTX).filter(filaTocada).length;
  const btn=document.getElementById('cguardar-btn');
  if(btn){btn.disabled=n===0;btn.textContent=n>0?'Guardar cambios ('+n+')':'Guardar cambios';}
}
function onCambioTipoComision(key){
  const ctx=COMISION_CTX[key];
  if(!ctx)return;
  ctx.current=document.getElementById('ctipo-'+key).value;
  document.getElementById('ccalc-'+key).innerHTML=calcTextoComision(ctx.current,ctx.importe,ctx.pct);
  if(!ctx.current&&ctx.origin==='detalle'){ // pasa a "sin comisión": ya no puede estar aprobada
    ctx.aprobC=false;const cb=document.getElementById('caprob-'+key);if(cb)cb.checked=false;
  }
  refrescarFilaComision(key);
}
function onCambioAprobacion(key){
  const ctx=COMISION_CTX[key];
  if(!ctx)return;
  ctx.aprobC=document.getElementById('caprob-'+key).checked;
  refrescarFilaComision(key);
}
function tildarTodosRecibos(valor){
  Object.keys(COMISION_CTX).forEach(key=>{
    const ctx=COMISION_CTX[key];
    if(ctx.origin!=='detalle'||!ctx.current)return; // solo recibos con comisión definida
    ctx.aprobC=valor;
    const cb=document.getElementById('caprob-'+key);if(cb)cb.checked=valor;
    refrescarFilaComision(key);
  });
}
async function guardarCambiosComision(liquidacionId){
  const cambios=Object.values(COMISION_CTX).filter(filaTocada);
  if(!cambios.length)return;
  if(COMISION_GRUPO&&COMISION_GRUPO.pagado&&cambios.some(c=>c.aprobO&&!c.aprobC)){
    alert('Este vendedor está marcado como Pagada. Para destildar recibos primero revertí la marca "Pagada" en la liquidación.');
    return;
  }
  if(!confirm('¿Guardar '+cambios.length+' cambio(s)?'))return;
  const btn=document.getElementById('cguardar-btn');
  if(btn){btn.disabled=true;btn.textContent='Guardando...';}
  try{
    const campoAprob=c=>c.aprobC?{aprobado:true,aprobado_por:CU.label,aprobado_at:new Date().toISOString()}:{aprobado:false,aprobado_por:null,aprobado_at:null};
    for(const ctx of cambios){
      if(ctx.current&&ctx.origin==='sin_comision'){
        // se resuelve: pasa de "Sin Comisión" a "Detalle"
        const r=calcularComisionTipo(ctx.current,ctx.importe,ctx.pct);
        await sbFetch('liquidacion_detalle',{method:'POST',body:JSON.stringify({
          liquidacion_id:ctx.liquidacion_id,vendedor_nombre:ctx.vendedor_nombre,empresa:ctx.empresa,
          fecha_pago:ctx.fecha_pago,cliente:ctx.cliente,nro_pago:ctx.nro_pago,tipo_doc:ctx.current,
          nro_documento:ctx.documento,importe_pago:ctx.importe,neto_documento:null,total_documento:null,
          base_comisionable:r.base,pct_comision:ctx.pct,comision_a_pagar:r.comision
        })});
        await sbFetch('liquidacion_sin_comision?id=eq.'+ctx.rowId,{method:'DELETE'});
      }else if(ctx.current&&ctx.origin==='detalle'){
        // ya estaba resuelta: se reclasifica a otro tipo y/o se cambia su aprobación (tilde)
        const patch={...campoAprob(ctx)};
        if(ctx.current!==ctx.original){
          const r=calcularComisionTipo(ctx.current,ctx.importe,ctx.pct);
          Object.assign(patch,{tipo_doc:ctx.current,base_comisionable:r.base,comision_a_pagar:r.comision});
        }
        await sbFetch('liquidacion_detalle?id=eq.'+ctx.rowId,{method:'PATCH',body:JSON.stringify(patch)});
      }else if(!ctx.current&&ctx.origin==='detalle'){
        // se revierte: vuelve de "Detalle" a "Sin Comisión"
        await sbFetch('liquidacion_sin_comision',{method:'POST',body:JSON.stringify({
          liquidacion_id:ctx.liquidacion_id,vendedor_nombre:ctx.vendedor_nombre,empresa:ctx.empresa,
          fecha_pago:ctx.fecha_pago,cliente:ctx.cliente,nro_pago:ctx.nro_pago,
          motivo:'Comisión sin definir todavía'+(ctx.documento?' — '+ctx.documento:''),importe:ctx.importe,aplica:''
        })});
        await sbFetch('liquidacion_detalle?id=eq.'+ctx.rowId,{method:'DELETE'});
      }
    }
    // el estado del vendedor (aprobada / pendiente) sale de cuántos recibos quedaron tildados
    await sincronizarEstadoGrupo(liquidacionId,COMISION_GRUPO.vendedor);
    closeModal();
    verLiquidacion(liquidacionId);
  }catch(e){alert('Error: '+e.message);if(btn){btn.disabled=false;btn.textContent='Guardar cambios';}}
}

// Aprobación / rechazo por vendedor dentro de la liquidación (liquidacion_vendedores.id).
// Tilda todos los recibos comisionados de un vendedor en una liquidación (aprobado=true).
async function aprobarRecibosVendedor(liquidacionId,vendedorNombre){
  await sbFetch('liquidacion_detalle?liquidacion_id=eq.'+liquidacionId+'&vendedor_nombre=eq.'+encodeURIComponent(vendedorNombre)+'&aprobado=eq.false',
    {method:'PATCH',body:JSON.stringify({aprobado:true,aprobado_por:CU.label,aprobado_at:new Date().toISOString()})});
}
async function aprobarGrupoVendedor(grupoId){
  try{
    const g=(await sbFetch('liquidacion_vendedores?id=eq.'+grupoId+'&select=*'))[0];
    await aprobarRecibosVendedor(g.liquidacion_id,g.vendedor_nombre);
    await sbFetch('liquidacion_vendedores?id=eq.'+grupoId,{method:'PATCH',body:JSON.stringify({estado:'aprobada',revisado_por:CU.label,revisado_at:new Date().toISOString(),motivo_rechazo:null})});
    verLiquidacion(g.liquidacion_id);
  }catch(e){alert('Error: '+e.message);}
}
function rechazarGrupoVendedor(grupoId){
  document.getElementById('modal').innerHTML=`
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-title">Rechazar comisión de este vendedor</div>
        <div class="form-group"><label>Motivo (obligatorio)</label><textarea id="motivo-rechazo" rows="3"></textarea></div>
        <div style="display:flex;gap:8px;justify-content:flex-end"><button onclick="closeModal()">Cancelar</button><button class="danger" onclick="confirmarRechazoGrupo(${grupoId})">Rechazar</button></div>
      </div>
    </div>`;
}
async function confirmarRechazoGrupo(grupoId){
  const motivo=document.getElementById('motivo-rechazo').value.trim();
  if(!motivo){alert('Ingresá un motivo');return;}
  try{
    const g=(await sbFetch('liquidacion_vendedores?id=eq.'+grupoId+'&select=*'))[0];
    // al rechazar al vendedor se destildan sus recibos (no suman a la cuenta corriente)
    await sbFetch('liquidacion_detalle?liquidacion_id=eq.'+g.liquidacion_id+'&vendedor_nombre=eq.'+encodeURIComponent(g.vendedor_nombre),
      {method:'PATCH',body:JSON.stringify({aprobado:false,aprobado_por:null,aprobado_at:null})});
    await sbFetch('liquidacion_vendedores?id=eq.'+grupoId,{method:'PATCH',body:JSON.stringify({estado:'rechazada',revisado_por:CU.label,revisado_at:new Date().toISOString(),motivo_rechazo:motivo,pagado:false,pagado_por:null,pagado_at:null})});
    closeModal();
    verLiquidacion(g.liquidacion_id);
  }catch(e){alert('Error: '+e.message);}
}
async function aprobarTodosPendientes(liquidacionId){
  if(!confirm('¿Aprobar todo lo pendiente de este mes (todos los recibos sin tildar de cada vendedor)? Los vendedores rechazados no se tocan.'))return;
  try{
    const grupos=await sbFetch('liquidacion_vendedores?liquidacion_id=eq.'+liquidacionId+'&estado=neq.rechazada&select=*');
    for(const g of grupos){
      await aprobarRecibosVendedor(liquidacionId,g.vendedor_nombre);
      if(g.estado!=='aprobada')await sbFetch('liquidacion_vendedores?id=eq.'+g.id,{method:'PATCH',body:JSON.stringify({estado:'aprobada',revisado_por:CU.label,revisado_at:new Date().toISOString()})});
    }
    verLiquidacion(liquidacionId);
  }catch(e){alert('Error: '+e.message);}
}

// Importe tal como se escribe en Argentina: "27.812" = 27812 (el punto es de miles), "27.812,50" =
// 27812,5, "27,5" = 27,5. Con puntos solamente y todos los grupos de 3 dígitos se toma como miles;
// con 1-2 decimales ("27.5", "27.81") se respeta como decimal.
function parseImporteAR(v){
  let s=String(v==null?'':v).trim().replace(/\$/g,'').replace(/\s/g,'');
  if(!s)return NaN;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>-1&&ld>-1)s=lc>ld?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(lc>-1)s=s.replace(/\./g,'').replace(',','.');
  else if(ld>-1){const p=s.split('.');if(p[0]!=='0'&&p.slice(1).every(x=>/^\d{3}$/.test(x)))s=p.join('');}
  const n=Number(s);
  return isNaN(n)?NaN:n;
}

function previewImportePago(){

function leerFormPago(){
  const fecha=document.getElementById('pago-fecha').value;
  const importe=parseImporteAR(document.getElementById('pago-importe').value);

    const err=document.getElementById('pago-err');err.classList.remove('hidden');err.textContent='Completá fecha e importe (mayor a 0)';
    return null;
  }
  return {fecha,importe,nota:nota||null};

// ============================================================
// MEDIOS DE PAGO DE UN RECIBO (cómo pagó el cliente)
// ============================================================
// Los datos viven en la tabla recibos_pago (salen de Odoo: account.payment + l10n_latam.check).
// Se abren en una segunda ventana (#modal2) para no pisar la ventana desde la que se tocó el recibo.
let RECIBOS_CACHE=null;
function claveRecibo(empresa,nro){return normKey(empresa)+'|'+String(nro||'').trim();}
async function cargarRecibosPago(){
  if(RECIBOS_CACHE)return RECIBOS_CACHE;
  const rows=await sbFetch('recibos_pago?select=*');
  RECIBOS_CACHE={};
  rows.forEach(r=>{RECIBOS_CACHE[claveRecibo(r.empresa,r.nro_pago)]=r;});
  return RECIBOS_CACHE;
}
// Número de recibo clickeable (se resuelve con un listener delegado, ver más abajo).
function reciboLink(empresa,nro){
  if(!nro)return '';
  return '<span class="recibo-link" data-emp="'+esc(empresa)+'" data-nro="'+esc(nro)+'" title="Ver cómo pagó el cliente">'+esc(nro)+'</span>';
}
document.addEventListener('click',e=>{
  const el=e.target.closest&&e.target.closest('.recibo-link');
  if(el){e.stopPropagation();verMediosRecibo(el.dataset.emp,el.dataset.nro);}
});
function closeModal2(){document.getElementById('modal2').innerHTML='';}
async function verMediosRecibo(empresa,nro){
  let r=null;
  try{r=(await cargarRecibosPago())[claveRecibo(empresa,nro)]||null;}
  catch(e){document.getElementById('modal2').innerHTML=modalSimple('Recibo '+esc(nro),'<div class="alert alert-red">No se pudieron leer los medios de pago: '+esc(e.message)+'</div>');return;}
  if(!r){
    document.getElementById('modal2').innerHTML=modalSimple('Recibo '+esc(nro),
      '<p class="small">No hay datos de medios de pago para este recibo. Puede ser un recibo cargado a mano o del sistema anterior (no está en Odoo), o de un mes que todavía no se importó.</p>');
    return;
  }
  const cheques=Array.isArray(r.cheques)?r.cheques:[];
  const totalCh=cheques.reduce((a,c)=>a+(c.importe||0),0);
  const fila=(k,v)=>v?'<div style="display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #f0f0f0"><span class="small" style="width:120px;flex:none">'+k+'</span><span>'+v+'</span></div>':'';
  const etiquetaMedio=r.medio==='Cheque'?'Cheque(s)':r.medio==='Echeq'?'Echeq(s)':esc(r.medio||'—');
  const cuerpo=
    fila('Empresa',esc(r.empresa))+fila('Fecha',fmtFecha(r.fecha))+fila('Cliente',esc(r.cliente||'—'))
    +fila('Importe del recibo','<b>'+fmt(r.importe)+'</b>')+fila('Medio de pago','<b>'+etiquetaMedio+'</b>')
    +fila('Diario / cuenta',esc(r.diario||''))+fila(r.medio==='Transferencia'||r.medio==='Transferencia / depósito'?'N° de operación':'Referencia',esc(r.referencia||''))
    +(cheques.length?`
      <div style="font-size:13px;font-weight:600;margin:16px 0 6px;color:#666">${cheques.length} ${r.medio==='Echeq'?'ECHEQ'+(cheques.length>1?'S':''):'CHEQUE'+(cheques.length>1?'S':'')}</div>
      <div class="table-wrap"><table><thead><tr><th>N°</th><th>Banco</th><th>Fecha de cobro</th><th>Importe</th></tr></thead>
      <tbody>${cheques.map(c=>'<tr><td>'+esc(c.numero)+'</td><td>'+esc(c.banco||'—')+'</td><td>'+fmtFecha(c.fecha_cobro)+'</td><td>'+fmt(c.importe)+'</td></tr>').join('')}
      <tr class="total-row"><td colspan="3">TOTAL</td><td>${fmt(totalCh)}</td></tr></tbody></table></div>`:'');
  document.getElementById('modal2').innerHTML=modalSimple('Recibo '+esc(r.nro_pago),cuerpo);
}
function modalSimple(titulo,cuerpoHtml){
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal2()">
    <div class="modal" style="max-width:620px">
      <div class="modal-title">${titulo}</div>

    document.getElementById('modal').innerHTML=`

          <div class="table-wrap" style="margin-bottom:16px;max-height:440px;overflow-y:auto"><table><thead><tr><th>Fecha</th><th>Empresa</th><th>Cliente</th><th>Recibo</th><th>Tipo</th><th>Importe del recibo</th><th>Base comisionable</th><th>%</th><th>Comisión</th></tr></thead>
          <tbody>${rows.length===0?'<tr><td colspan="9" class="small" style="white-space:normal">Sin recibos.</td></tr>':rows.map(r=>'<tr><td>'+fmtFecha(r.fecha_pago)+'</td><td>'+esc(r.empresa)+'</td><td>'+esc(r.cliente)+'</td><td>'+reciboLink(r.empresa,r.nro_pago)+'</td><td>'+esc(r.tipo_doc)+'</td><td>'+fmt(r.importe_pago)+'</td><td>'+fmt(r.base_comisionable)+'</td><td>'+r.pct_comision+'%</td><td>'+fmt(r.comision_a_pagar)+'</td></tr>').join('')}
          <tr class="total-row"><td colspan="6">TOTAL (${rows.length} recibos)</td><td>${fmt(base)}</td><td></td><td>${fmt(total)}</td></tr>
          </tbody></table></div>
          <div style="text-align:right"><button onclick="closeModal()">Cerrar</button></div>
        </div>
      </div>`;
  }catch(e){alert('Error: '+e.message);}
}

// ============================================================
// AVISO DE VERSIÓN NUEVA
// ============================================================
// Cada tanto (y al volver a la pestaña) se vuelve a pedir el index.html sin caché y se compara con
// el que se cargó al abrir; si cambió, aparece una barra arriba para refrescar. No hace falta
// tocar ningún número de versión: cualquier cambio publicado dispara el aviso.
let APP_HASH=null;
function hashTexto(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h;}
async function chequearVersionNueva(){
  try{
    const r=await fetch(location.pathname+'?_v='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const h=hashTexto(await r.text());
    if(APP_HASH===null){APP_HASH=h;return;}
    if(h!==APP_HASH)mostrarAvisoVersionNueva();
  }catch(e){/* sin red: se reintenta en el próximo ciclo */}
}
function mostrarAvisoVersionNueva(){
  if(document.getElementById('aviso-version'))return;
  const d=document.createElement('div');
  d.id='aviso-version';
  d.innerHTML='<span>🔔 Hay una nueva versión del aplicativo.</span> <button onclick="location.reload()">Actualizar ahora</button>';
  document.body.prepend(d);
  document.body.classList.add('con-aviso');
}
chequearVersionNueva();
setInterval(chequearVersionNueva,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)chequearVersionNueva();});
</script>
</body>
</html>
